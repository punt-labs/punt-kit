name: Ratchet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the ratchets read the baseline at the merge base
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Ratchets (PR, merge-base compare)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          BASE="$(git merge-base "origin/${BASE_REF}" HEAD)"
          OO_ARGS="--base-ref ${BASE} --require-base"
          case "${HEAD_REF}" in
            release/*|post-release/*) OO_ARGS="${OO_ARGS} --allow-no-improvement" ;;
          esac
          make check-oo OO_BASE="${OO_ARGS}"
          make check-coupling COUPLING_BASE="--base-ref ${BASE} --require-base"
          make check-suppressions SUPPRESSION_BASE="--base-ref ${BASE} --require-base"
      - name: Ratchets (main, post-merge tripwire)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare against the pre-push tip so every commit in the push is covered.
          BASE="HEAD~1"
          if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="${BEFORE}"
          fi
          make check-oo OO_BASE="--base-ref ${BASE} --require-base --allow-no-improvement --tripwire"
          make check-coupling COUPLING_BASE="--base-ref ${BASE} --require-base --tripwire"
          make check-suppressions SUPPRESSION_BASE="--base-ref ${BASE} --require-base --tripwire"
