name: Propagate Release

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo (e.g. punt-labs/biff)"
        required: true
        type: string
      tag:
        description: "Git tag (e.g. v0.3.0)"
        required: true
        type: string

permissions: {}

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      INPUT_REPO: ${{ inputs.repo }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update install-all.sh SHA
        run: |
          INSTALL_ALL="install-all.sh"
          if [ ! -f "$INSTALL_ALL" ]; then
            echo "No install-all.sh found — skipping"
            exit 0
          fi

          export SHORT="${INPUT_REPO#*/}"

          # Get the SHA of the tag in the source repo (handle annotated tags)
          TAG_INFO=$(gh api "repos/$INPUT_REPO/git/ref/tags/$INPUT_TAG" --jq '.object.sha + " " + .object.type' 2>/dev/null || echo "")
          if [ -z "$TAG_INFO" ]; then
            echo "Could not resolve tag info for $INPUT_TAG in $INPUT_REPO — skipping"
            exit 0
          fi
          TAG_SHA=$(echo "$TAG_INFO" | cut -d' ' -f1)
          TAG_TYPE=$(echo "$TAG_INFO" | cut -d' ' -f2)

          # Annotated tags point to a tag object; dereference to get commit SHA
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_SHA=$(gh api "repos/$INPUT_REPO/git/tags/$TAG_SHA" --jq '.object.sha' 2>/dev/null || echo "")
            if [ -z "$TAG_SHA" ]; then
              echo "Could not dereference annotated tag $INPUT_TAG — skipping"
              exit 0
            fi
          fi
          SHORT_SHA="${TAG_SHA:0:7}"

          # Replace the SHA in the curl URL for this project
          # Pattern: $GH/<project>/<SHA>/install.sh
          sed -i "s|\(\$GH/$SHORT/\)[a-f0-9]\{7,40\}\(/install.sh\)|\1${SHORT_SHA}\2|g" "$INSTALL_ALL"

          if git diff --quiet "$INSTALL_ALL"; then
            echo "No install-all.sh changes needed"
          else
            git add "$INSTALL_ALL"
            git commit -m "chore: update $SHORT install SHA to $INPUT_TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create PR
        run: |
          if git diff --quiet HEAD origin/main; then
            echo "Nothing to push"
            exit 0
          fi

          SHORT="${INPUT_REPO#*/}"
          BRANCH="propagate/${SHORT}-${INPUT_TAG}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: update $SHORT install SHA to $INPUT_TAG" \
            --body "Automated propagation from ${INPUT_REPO} ${INPUT_TAG}." \
            --head "$BRANCH" \
            --base main)
          echo "Created PR: $PR_URL"

          gh pr merge "$PR_URL" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
