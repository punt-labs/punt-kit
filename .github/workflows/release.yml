name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate tag ref
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Release must be triggered by a v* tag push. For manual dispatch, use: gh workflow run release.yml --ref v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  published-smoke:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Smoke test the published CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Smoke testing punt-kit==$version from PyPI"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          cd "$work"
          unset PYTHONPATH PYTHONHOME
          unset UV_INDEX UV_INDEX_URL UV_EXTRA_INDEX_URL UV_FIND_LINKS UV_NO_INDEX
          uv venv --python 3.13 venv
          for attempt in {1..6}; do
            if uv --no-config pip install --python venv/bin/python \
                --default-index https://pypi.org/simple/ --refresh-package punt-kit \
                "punt-kit==$version"; then
              break
            fi
            if (( attempt == 6 )); then
              echo "::error::Could not install punt-kit==$version from PyPI"
              exit 1
            fi
            sleep 7
          done
          actual=$(venv/bin/punt version)
          if [[ "$actual" != "punt $version" ]]; then
            echo "::error::Expected punt $version, got $actual"
            exit 1
          fi
          printf '%s\n' '[project]' 'name = "smoke-demo"' >pyproject.toml
          mkdir .beads
          venv/bin/punt init .
          test -s .github/workflows/lint.yml
          echo "Published PyPI smoke passed: $actual (scaffolded Python CI)"
