name: Biff CI Notifications
on:
  workflow_run:
    workflows: ["Docs", "Lint", "Ratchet", "Release", "Test"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    # Trusted runs only: this job's env carries secrets.BIFF_RELAY_TOKEN, so
    # pull_request-sourced completions (forks) must never reach it.
    if: >-
      (github.event.workflow_run.conclusion == 'failure'
       || github.event.workflow_run.conclusion == 'timed_out')
      && (github.event.workflow_run.event == 'push'
          || (github.event.workflow_run.name == 'Release'
              && github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default branch, not the failing commit: a branch must not be
          # able to rewrite .punt-labs/biff and redirect the notification.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .punt-labs/biff
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          # head_branch is null for tag pushes; fall back to the SHA.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BIFF_RELAY_URL: ${{ vars.BIFF_RELAY_URL }}
          BIFF_RELAY_TOKEN: ${{ secrets.BIFF_RELAY_TOKEN }}
          BIFF_RELAY_TLS_HANDSHAKE_FIRST: ${{ vars.BIFF_RELAY_TLS_HANDSHAKE_FIRST }}
        run: >-
          uvx --from punt-biff==1.19.0 biff --user github-actions wall
          "CI failed: ${WORKFLOW_NAME} on ${BRANCH} — ${RUN_URL}"
          --duration 2h
