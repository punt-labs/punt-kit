name: Handoff runtime

on:
  pull_request:
    paths:
      - .github/workflows/handoff-runtime.yml
      - .punt-labs/ethos/checks/snapshots/punt-kit.yaml
      - pyproject.toml
      - scripts/*handoff-runtime.sh
      - uv.lock
  workflow_dispatch:
    inputs:
      run-id:
        description: Run ID of the build that produced the pinned runtime
        required: true
        type: string

permissions: {}

jobs:
  build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Build and smoke-test the relocated runtime offline
        run: |
          mkdir runtime-assets
          archive=$(scripts/build-handoff-runtime.sh runtime-assets)
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/runtime" "$scratch/home" "$scratch/tmp"
          tar -xzf "$archive" -C "$scratch/runtime"
          runtime="$scratch/runtime"
          cp -R "$runtime/cache/uv" "$scratch/uv-cache"
          cp -R "$runtime/cache/npm" "$scratch/npm-cache"
          sudo unshare --net --setuid "$(id -u)" --setgid "$(id -g)" -- \
            env -i HOME="$scratch/home" TMPDIR="$scratch/tmp" \
            PATH="$runtime/bin:$runtime/node/bin:$runtime/python/bin:/usr/bin:/bin" \
            UV_PYTHON="$runtime/python/bin/python3.13" UV_PYTHON_DOWNLOADS=never \
            UV_CACHE_DIR="$scratch/uv-cache" UV_PROJECT_ENVIRONMENT="$scratch/venv" \
            UV_LINK_MODE=copy UV_OFFLINE=1 UV_LOCKED=1 npm_config_offline=true \
            npm_config_update_notifier=false npm_config_cache="$scratch/npm-cache" \
            bash -ec 'uv sync --offline --locked
              uv run oo-ratchet --help
              uv run pyright --version
              uv run --no-project --with packaging python -I -c "import packaging.version"
              uv venv --offline --python 3.13 "$(mktemp -d)"
              npx --yes markdownlint-cli2 --version'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: punt-kit-handoff-runtime
          path: runtime-assets/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency: handoff-runtime-release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: punt-kit-handoff-runtime
          path: runtime-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
      - name: Publish only the bytes pinned on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(python3 -c 'import json, sys; p = json.load(open(sys.argv[1]))["checks"]["full-gate"]["runtime"]["platforms"]["linux-amd64"]; print(p["url"], p["sha256"])' .punt-labs/ethos/checks/snapshots/punt-kit.yaml)
          read -r url sha <<< "$pin"
          if [[ ! $sha =~ ^[0-9a-f]{64}$ ||
                ! $url =~ ^https://github\.com/punt-labs/punt-kit/releases/download/(handoff-runtime-v[1-9][0-9]*)/(punt-kit-linux-amd64-v[1-9][0-9]*\.tar\.gz)$ ]]; then
            echo 'Invalid release URL or digest in the snapshot sidecar.' >&2
            exit 2
          fi
          tag=${BASH_REMATCH[1]}
          asset=${BASH_REMATCH[2]}
          cd runtime-assets
          printf '%s  %s\n' "$sha" "$sha.tar.gz" | sha256sum --check
          mv -- "$sha.tar.gz" "$asset"
          printf '%s  %s\n' "$sha" "$asset" > "$asset.sha256"
          gh release create "$tag" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "punt-kit handoff runtime $tag" \
            --notes 'Offline toolchain for the punt-kit Ethos handoff gate (Linux x86-64).'
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
