[project]
name = "punt-kit"
version = "0.18.0"
description = "Standards, scaffolding, and compliance tooling for Punt Labs projects"
requires-python = ">=3.13"
authors = [{ name = "Punt Labs" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "punt-observe==0.1.1",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    "packaging>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pyright>=1.1.0",
    "punt-oo-ratchet==0.3.0",
    "pydoclint==0.12.0",
    "docstring-parser-fork==0.0.16",
    "markdown==3.11.3",
    "types-markdown>=3.10,<4",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
]

[project.urls]
Homepage = "https://github.com/punt-labs/punt-kit"
Repository = "https://github.com/punt-labs/punt-kit"
"Bug Tracker" = "https://github.com/punt-labs/punt-kit/issues"

[project.scripts]
punt = "punt_kit.__main__:app"

[build-system]
requires = ["uv_build>=0.9.14,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "punt_kit"

[tool.ruff]
line-length = 88
target-version = "py313"
# Preserved design inputs published verbatim with the plan, not punt-kit source.
extend-exclude = [".docs/native-harness-plan/sources", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "LOG", "G", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = false
allow-init-docstring = true
check-style-mismatch = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
# tools/ has no __init__.py; tests import it as tools.record_gh_fixtures, so
# the file must map to that one module name when checked directly too. With
# explicit bases, src/ must be a base or punt_kit resolves as src.punt_kit.
explicit_package_bases = true
mypy_path = "src"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.punt.pii]
allow_emails = ["hello@punt-labs.com"]
ignore_files = ["tests/test_pii.py", ".beads/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
