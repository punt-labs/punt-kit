[project]
name = "punt-kit"
version = "0.18.0"
description = "Standards, scaffolding, and compliance tooling for Punt Labs projects"
requires-python = ">=3.13"
authors = [{ name = "Punt Labs" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "punt-observe==0.1.1",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    "packaging>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pyright>=1.1.0",
    "punt-oo-ratchet==0.4.0",
    "pydoclint==0.12.0",
    "docstring-parser-fork==0.0.16",
    "markdown==3.11.3",
    "types-markdown>=3.10,<4",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
]

[project.urls]
Homepage = "https://github.com/punt-labs/punt-kit"
Repository = "https://github.com/punt-labs/punt-kit"
"Bug Tracker" = "https://github.com/punt-labs/punt-kit/issues"

[project.scripts]
punt = "punt_kit.__main__:app"

[build-system]
requires = ["uv_build>=0.9.14,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "punt_kit"

[tool.ruff]
line-length = 88
target-version = "py313"
# Preserved design inputs published verbatim with the plan, not punt-kit source.
extend-exclude = [".docs/native-harness-plan/sources", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "LOG", "G", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = false
allow-init-docstring = true
check-style-mismatch = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
# tools/ has no __init__.py; tests import it as tools.record_gh_fixtures, so
# the file must map to that one module name when checked directly too. With
# explicit bases, src/ must be a base or punt_kit resolves as src.punt_kit.
explicit_package_bases = true
mypy_path = "src"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.punt.pii]
allow_emails = ["hello@punt-labs.com"]
ignore_files = ["tests/test_pii.py", ".beads/*"]

[tool.oo-ratchet.layers]
entry = [
    "punt_kit.__main__",
    "punt_kit.audit",
    "punt_kit.doctor",
    "punt_kit.init",
    "punt_kit.pii",
    "punt_kit.seed",
]
adapters = [
    "punt_kit.audit_github",
    "punt_kit.claude_md",
    "punt_kit.claude_permissions",
    "punt_kit.detect",
    "punt_kit.git_checkout",
    "punt_kit.init_beads",
    "punt_kit.logging_config",
    "punt_kit.telemetry",
    "punt_kit.telemetry_settings",
    "punt_kit.phases.shared.changelog",
    "punt_kit.phases.shared.ci_run",
    "punt_kit.phases.shared.command_diagnostics",
    "punt_kit.phases.shared.command_runner",
    "punt_kit.phases.shared.gh",
    "punt_kit.phases.shared.git",
    "punt_kit.phases.shared.github_repo",
    "punt_kit.phases.shared.json_file",
    "punt_kit.phases.shared.phase_diagnostics",
    "punt_kit.phases.shared.pin_currency",
    "punt_kit.phases.shared.plugin_swap",
    "punt_kit.phases.shared.pr_merge",
    "punt_kit.phases.shared.pr_threads",
    "punt_kit.phases.shared.project_info",
    "punt_kit.phases.shared.release_tag_file",
    "punt_kit.phases.shared.reporter",
    "punt_kit.phases.shared.siblings",
    "punt_kit.phases.shared.text_file",
    "punt_kit.phases.shared.user_service",
    "punt_kit.phases.shared.wheel_contents",
    "punt_kit.phases.shared.wheel_probe",
    "punt_kit.phases.shared.wheel_version",
]
application = [
    "punt_kit.audit_layout",
    "punt_kit.audit_permissions",
    "punt_kit.enablement",
    "punt_kit.status",
    "punt_kit.release",
    "punt_kit.phases",
    "punt_kit.phases.shared",
    "punt_kit.phases.phase01_preflight",
    "punt_kit.phases.phase02_version_bump",
    "punt_kit.phases.phase03_build",
    "punt_kit.phases.phase04_release_pr",
    "punt_kit.phases.phase05_tag",
    "punt_kit.phases.phase06_ci_wait",
    "punt_kit.phases.phase07_github_release",
    "punt_kit.phases.phase08_verify_pypi",
    "punt_kit.phases.phase09_post_release",
    "punt_kit.phases.phase10_homebrew",
    "punt_kit.phases.phase10_propagate",
    "punt_kit.phases.phase10_website",
    "punt_kit.phases.phase11_checks",
    "punt_kit.phases.phase11_verify",
    "punt_kit.phases.phase11_versions",
    "punt_kit.phases.shared.pipeline",
    "punt_kit.phases.shared.project_remote",
    "punt_kit.phases.shared.readme_sha",
    "punt_kit.phases.shared.skips",
