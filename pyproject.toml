[project]
name = "punt-kit"
version = "0.13.0"
description = "Standards, scaffolding, and compliance tooling for Punt Labs projects"
requires-python = ">=3.13"
authors = [{ name = "Punt Labs" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tomli-w>=1.0.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pyright>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/punt-labs/punt-kit"
Repository = "https://github.com/punt-labs/punt-kit"
"Bug Tracker" = "https://github.com/punt-labs/punt-kit/issues"

[project.scripts]
punt = "punt_kit.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/punt_kit"]

# Declare what the sdist SHIPS rather than what it must not. Hatchling's default
# is include-everything-not-VCS-ignored, which fails open: any untracked file in
# the tree — editor config, scratch notes, local agent state — lands in a
# published tarball, permanently and unlistably. An allowlist fails closed, so a
# new stray file is absent by default rather than published by default.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/standards",
    "/patterns",
    "/playbooks",
    "/lang-rules",
    "/commands",
    "/skills",
    "/scripts",
    "/.claude-plugin",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CLAUDE.md",
    "/DESIGN.md",
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/install.sh",
    "/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.punt.pii]
allow_emails = ["hello@punt-labs.com"]
ignore_files = ["tests/test_pii.py", ".beads/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
