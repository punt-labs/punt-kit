[project]
name = "punt-kit"
version = "0.14.2"
description = "Standards, scaffolding, and compliance tooling for Punt Labs projects"
requires-python = ">=3.13"
authors = [{ name = "Punt Labs" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tomli-w>=1.0.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pyright>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/punt-labs/punt-kit"
Repository = "https://github.com/punt-labs/punt-kit"
"Bug Tracker" = "https://github.com/punt-labs/punt-kit/issues"

[project.scripts]
punt = "punt_kit.__main__:app"

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "punt_kit"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.punt.pii]
allow_emails = ["hello@punt-labs.com"]
ignore_files = ["tests/test_pii.py", ".beads/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
