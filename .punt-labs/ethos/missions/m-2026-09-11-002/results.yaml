      prose: |
        Round 2 addressed all three of rmh's blocking findings plus every bot
        review comment across both rounds (25 threads total, 0 unresolved,
        mergeStateStatus CLEAN):

        1. READ-ONLY INVARIANT (the headline finding). Normalized every -X/
           --method/-f/-F/--field/--raw-field spelling gh's own pflag parser
           accepts identically (split, equals-form, short-attached-form,
           short-attached-with-equals) before comparing, refused --input
           unconditionally on both endpoint shapes (a mutation's text can live
           entirely in a file this tool cannot inspect), fixed --method/-X to
           consider every occurrence together and use the LAST one (matching
           gh's last-occurrence-wins semantics for a repeated or dual-spelled
           flag — a genuinely distinct sub-bug the first fix pass missed), and
           removed the configurable `allowlist` constructor parameter entirely
           (a caller could otherwise instantiate ReadOnlyGhRunner with a
           mutating shape baked in). This took four consecutive fix-and-verify
           cycles as bot review kept finding one more spelling/occurrence
           variant each pass (-X=PUT missing the leading-'=' strip; -X=POST
           independently rediscovering the same already-fixed gap) — each is
           now covered by a parametrized regression test naming the exact
           spelling. Also fixed a secondary leak: the refusal exception's
           message initially interpolated the raw secret substring that
           triggered it, defeating the sanitizer's own guarantee the moment an
           operator pasted the traceback anywhere — now reports only the
           redacted form.
        2. Gave every fixture a real consumer: PrMerger.merge driven end-to-end
           (push/list/create/wait/view/resolve/squash-merge-retry/post-merge)
           against both gh_pr_merge_*.json fixtures (the two flagged as most
           safety-critical, since they validate is_transient's retry
           classification), Phase7GithubRelease.run against both
           gh_release_view_*.json fixtures and gh_release_create_success.json,
           and PrThreadResolver.resolve against gh_graphql_pr_threads_empty.json.
        3. Added FaultRule.from_fixture's missing-fixture (FileNotFoundError),
           malformed-JSON (JSONDecodeError), and missing-required-key (KeyError)
           tests.

        Also fixed, from bot review beyond rmh's three items: GhTargetDiscovery
        now filters release runs to event=="push" (a workflow_dispatch run
        could otherwise be mis-recorded as the tag-run fixture); added the
        missing gh_run_watch_healthy.json fixture to close a real inventory gap
        (Phase 6's gh run watch, documented as having no contract-test consumer
        since production only checks its returncode); GhFixtureDriftChecker
        preserves every distinct list-element shape instead of only the first
        (a heterogeneous GraphQL contexts array could otherwise drift
        undetected past element 0); GhFixtureRecorder now REFUSES (rather than
        silently redacts) a command that needs sanitization, since --check
        replays _meta.command literally and a silently-redacted branch name
        would target the wrong ref; GhSanitizer only blanks string values under
        an identity key, recursing into nested objects instead of corrupting
        their shape; --check fails loud on an empty/missing --dest instead of
        reporting a vacuous "no drift"; and main()'s path-printing no longer
        crashes when --dest is outside the repo root. Reconciled the fixture
        inventory count (29 total, 16 recorded, 13 hand-authored — corrected
        from an initial 27/15/12 miscount) in both CHANGELOG.md and the PR
        description.

        One test made resilient to its own live data source: the
        ungoverned-checks test depends on a fixture recorded against a real,
        still-open PR, and re-recording during this round caught it mid-CI-run
        with a check genuinely pending — the test now chains to a
        permanently-settled fixture as a guaranteed-terminating fallback and
        derives its assertions from that fixture's own content instead of a
        hardcoded check name.
