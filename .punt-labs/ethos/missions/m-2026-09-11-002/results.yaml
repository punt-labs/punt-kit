      prose: |
        Delivered the full Wave 1 scope: tools/record_gh_fixtures.py (ReadOnlyGhRunner,
        GhSanitizer, GhTargetDiscovery, GhRecordingPlan, GhFixtureRecorder,
        GhFixtureDriftChecker), a 27-fixture library under tests/fixtures/gh/ (15
        recorded live, 12 hand-authored and marked hand_authored: true in _meta),
        tests/harness/gh_shapes.py (fixture-authoring TypedDicts + typed loader),
        tests/test_gh_fixture_contracts.py (drives GithubRepo, RequiredChecksWaiter,
        TagRunSelector, PrMerger, PrThreadResolver, CiRunWatch against every fixture,
        plus the version-stamp gate), and tests/test_record_gh_fixtures.py (recorder
        unit tests). Zero src/ changes.

        One design-extension beyond the explicit ask: gh api silently defaults a REST
        call to POST the instant a -f/-F/--field/--raw-field/--input body flag is
        present, with no explicit -X required to trigger it — a mutation path the
        design's -X/--method check does not by itself close on a repos/... endpoint.
        Added a dedicated refusal in ReadOnlyGhRunner._require_read_only_api_call plus
        a regression test proving it. No other deviation from the merged design.

        No src/ changes were needed — every fixture is consumed via the existing
        ReleaseOps injection seam (GithubRepo, RequiredChecksWaiter, TagRunSelector,
        PrMerger, PrThreadResolver, CiRunWatch all already take ops at construction).
