    R1 — STRUCTURAL, LEADER RULING: enforce the git-hook timeout at RUNTIME, not by AST heuristic.
    The AST hook-timeout audit (tests/harness/run_calls.py + its tests in test_release.py) has leaked in two consecutive rounds: clustered gh short flags (`-sd`), wrapper binaries (`env git push`, `sh -c "git push"`), trusted variable names, aliases (`run = ops.run`), and allowlist entries whose recorded fires_hooks can drift from the code. These are all consequences of guessing runtime argv from source. The defect class it guards (G1: a hook-firing command on the 60s default timeout) is removed instead at the one place every command passes through with concrete argv:
    - Move the hook-firing classification into src (a small, typed class under src/punt_kit/phases/shared/, e.g. HookFiringCommand), operating on the CONCRETE argv list: git with global options skipped (-C <dir>, -c k=v, --git-dir=, --work-tree=, --no-pager, etc.) and the hook-firing verb set (checkout, switch, commit, merge, rebase, reset, cherry-pick, push, pull, am, clone, and any other verb that runs hooks — state the set and why); gh with -R/--repo skipped and the gh subcommands that run local git (pr checkout/co, repo sync, repo clone, repo fork --clone, repo create --push, issue develop -c/--checkout, pr merge with -d/--delete-branch including clustered short flags such as -sd/-ds, pr create without --head); wrappers (env, sh/bash -c, any argv[0] basename of git/gh at any position after env) classified conservatively as hook-firing. Over-approximation is the safe direction: misclassifying only lengthens a timeout ceiling.
    - The ops layer (ReleaseOps.run and whatever every phase call reaches — find the single choke point) applies a timeout FLOOR of GIT_HOOK to any command the classifier marks hook-firing, regardless of the timeout the caller passed. Callers that already pass GIT_HOOK are unchanged. Do not lower any caller's longer timeout.
    - Unit-test the classifier exhaustively with concrete argv (every case gvr found escaping, including -sd, -ds, -cb, env/sh -c wrappers, -C/-c globals, `--delete-branch=true`), and test that the ops layer applies the floor (a 60s caller timeout on a hook-firing argv reaches subprocess as GIT_HOOK; a non-hook argv keeps its timeout).
    - Then delete the AST audit (tests/harness/run_calls.py, its tests, the allowlist, and the audit tests in test_release.py) — it is superseded, and keeping it would be a second, weaker enforcement of the same rule. Keep any part of it that tests something the runtime floor does not cover, and say what and why.
    - Remove now-redundant explicit timeout=GIT_HOOK arguments ONLY if the floor makes them provably equivalent; otherwise leave them.

