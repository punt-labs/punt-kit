      prose: |
        Wave 5 delivered: tests/test_release_resume_sweep.py — one parametrized
        test, 11 cases, one per resume point. Each case drives run_release FRESH
        against a fully scripted release (real git repos; FaultRules for every
        gh/uv/PyPI boundary; a stateful _GithubSim behind FaultInjectingOps's
        explicit passthrough allowlist for gh pr create/view/list, gh pr merge
        --squash — emulated as a REAL local squash commit so the tag's commit,
        pyproject-on-main, and every Phase 11 check are genuine git state —
        gh run list with headSha computed from the tag's actual commit, and
        uv build producing real dist/ artifacts), stops it during phase N on one
        of phase N's own commands, asserts the incomplete-release report (phase
        label + exact --resume-from string) and that the tag exists iff the stop
        came after Phase 5, then resumes from the genuine post-stop state and
        asserts clean completion to the identical end state of a never-stopped
        release.

        Stop mechanisms per the corrected two-path model: main-thread phases use
        a KeyboardInterrupt subclass whose construction sets release._interrupted
        (the signal handler's atomic set-and-raise, modeled exactly); phases 9/10
        (pool workers) use a raised ReleaseError — the contract's sanctioned
        alternative — because a real signal's KeyboardInterrupt is never
        delivered to a worker thread; the polled-event worker path is Wave 3's
        existing coverage.

        Anchors: the phase's first command where its argv is unique to that
        phase; the first DISTINCTIVE command where the literal first collides
        with an earlier phase's argv (prefix matching is blind to phase
        context); verify uses the literal first command with skip=1 (Phase 5's
        one earlier occurrence). Every case asserts anchor._consumed == 1, so a
        mis-placed anchor fails loudly rather than passing vacuously.

        Case results: preflight / bump / build / release-pr / tag / ci /
        github-release / pypi / post-release / propagate / verify — all clean.
        One genuine gap found, on the sweep's very first case: run_release's
        interrupt finally (cleanup + incomplete-release report + exit-1) only
        wrapped phases 2-11; phase 1 preflight and version detection ran outside
        the try, so a real Ctrl-C during preflight escaped as a raw
        KeyboardInterrupt with no report, no --resume-from hint, no cleanup —
        contradicting _print_incomplete_release's own "called from every
        stop-early path" contract. Filed as pkit-f85t.11 (P1, parent pkit-f85t),
        fixed in-branch (pure containment move), closed; mutation-verified: with
        the fix stashed the preflight case dies with the escaping
        KeyboardInterrupt.

        Verification: make check green per commit (681 passed, 14 skipped);
        sweep wall-clock 3.73s; the longest case (verify) traced end-to-end
        showing all 10 prior phases genuinely execute (release PR #1 created and
        really squash-merged, tag at merged HEAD, CI wait matched against the
        tag's real commit, concurrent 9/10 with website sibling PR #2 propagated
        and merged) before the stop lands in Phase 11. Zero network. A
        completeness guard ties the case list to release._PHASE_ORDER so a 12th
        phase forces a 12th case.

        PR: punt-labs/punt-kit#360 (open, not merged). Branch feat/harness-wave5,
        two commits (fix+tests; changelog). Beads: pkit-f85t.11 filed and closed.
