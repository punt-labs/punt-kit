      prose: |
        The test built its "outside the repo" path from pytest's tmp_path,
        which inherits TMPDIR. This project's .envrc exports TMPDIR into
        .tmp/ under the repo root, so tmp_path landed inside the repo and the
        outside-the-repo premise collapsed.

        Fix: build the temp dir independent of TMPDIR. Clear the env var via
        monkeypatch.delenv and also clear tempfile's cached answer
        (monkeypatch.setattr(tempfile, "tempdir", None)) — gettempdir()
        resolves once per process and remembers the answer in the tempfile.tempdir
        module attribute, so deleting the env var alone is not sufficient once
        another test has already triggered resolution. With both cleared,
        tempfile.TemporaryDirectory() falls through to the real system temp
        root regardless of what TMPDIR was set to. Test intent (display-path
        falls back to an absolute path outside the repo) is preserved; a
        precondition assertion (not outside.is_relative_to(_ROOT)) makes the
        outside-the-repo premise explicit rather than assumed.

        Branch: fix/pkit-17qo-tmpdir-test
        Commit: 810cddc
