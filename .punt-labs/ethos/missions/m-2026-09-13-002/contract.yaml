context: test_display_path_falls_back_to_absolute_outside_the_repo in tests/test_record_gh_fixtures.py fails ONLY when TMPDIR points inside the repo — which this project's .envrc does (it exports TMPDIR into .tmp/ at the repo root). The test uses pytest's tmp_path as its 'outside the repo' path, but when TMPDIR is inside the repo, tmp_path resolves under the repo root, so the outside-the-repo premise collapses and the assertion fails. Pre-existing on main; CI stays green because CI has no such TMPDIR. Test-only bug.
