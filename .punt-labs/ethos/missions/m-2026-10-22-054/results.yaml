      prose: |
        # m-2026-10-22-054 result (round 2, consolidated)

        Branch refactor/release-legacy-helpers. `make check` green before every commit; final run 749 passed, 14 skipped (763 collected). No suppression remains for `PrMerger._select_existing`, `PrMerger._is_merged`, or `release._skips` in tests, and none was added anywhere.

        ## Round 1 findings

        - T1 (791c181): every function-local import in tests/test_release.py hoisted to the header; none had to stay local.
        - T2 (fde8791, d8ab0a5): dropped the five `_select_existing` tests (covered by the contract tests and merge-level tests); kept the unique OPEN-beside-MERGED case as a merge-level test. `release._skips` reach-ins replaced by an autouse `skips` fixture (monkeypatch). In tests/test_gh_fixture_contracts.py the `_select_existing`/`_is_merged` suppressions are gone: promotion rejected (the design doc records both as private), the seven tests now drive `PrMerger.merge` with the recorded fixtures.
        - T3 (b531568, a512aa0): 56 constructions go through `_fault_ops()`; protection/ruleset payloads share one source.
        - T4 (a512aa0): GithubRepo protection/ruleset tests match the full argv; new test shows the wrong endpoint hits deny-by-default.
        - T5 (c5117f9, 33a0843, 8bce2fc): `SiblingRepo.validate` tests and all 53 bare `pytest.raises(ReleaseError)` carry a match. 17 match the raised message; the 36 Phase 11 tests (generic message) assert the printed verdict lines through `_assert_failed_checks`: the exact failed-check list plus cause text. Three tests fail more than their name says because their setup also breaks it (`fails_when_install_all_missing`, `install_all_sha_fails_when_not_ancestor_of_tag` also fail `profile SHA`; `profile_sha_marketplace_chain_missing_sibling` also fails `marketplace`); the assertion records that.
        - T6 (e7523c3): dry-run bump test asserts the output line.
        - S1 (e7523c3): `ReadmeShaPin.land` dry-run calls `bump(dry_run=True)`; test proves it writes nothing. Accepted: prints nothing when no rewrite is needed.
        - S2 (e7523c3): warnings for an unresolved slug and for a stale pin (reworked in round 2, below).
        - S3 (6edcd62): nine unreferenced aliases deleted. Kept (referenced by tests): `_DEFAULT_RUN_TIMEOUT`, `_GIT_HOOK_TIMEOUT`, `_QUALITY_GATE_TIMEOUT`, `_CI_RUN_POLL_*`, `_TagRunSelector`.
        - S4 (6edcd62, e7523c3, c5117f9, 6e261c2, 0c2e76e): every tracker/bead ID removed from comments and docstrings under src/punt_kit and tests/test_release.py; `grep -rn "pkit-" src/punt_kit` returns nothing.
        - S5 (6edcd62): the `monkeypatch.setattr(release, "_run", ...)` seam is still used by about 50 tests, so the adapter docstring stays; only the stale clause was removed.

        ## Defect found and fixed (d91f3c4)

        `test_preflight_fails_empty_unreleased` passed for the wrong reason: the `[Unreleased]` pattern swallowed the blank line, so an empty section captured the next release's notes (preflight reported entries; `suggest_next_version` could read the prior release's `### Added`). One line-anchored pattern now serves both callers; regression test added.

        ## Round 2 findings (gvr)

        1. Stale-pin warning too broad (7bbf8b1): the `/install.sh` substring gate is gone. `bump` and the check now build from one `_PINNED` segment (SHA or vX.Y.Z) and `_url_prefix`, which accepts `owner=None`. The two substitutions merged into one. The warning fires only when the resolved owner's substitution matched nothing AND this repo name appears pinned under another owner. Four no-warning tests: `./install.sh`, `bash scripts/install.sh`, an unpinned same-repo URL, another repo's pinned URL. Note: a repo renamed under the same owner no longer warns (its slug comes from the git remote, so the substitution matches); another tool's pinned URL is also silent. The earlier "renamed" test now uses `other-org/proj`.
        2. CRLF (18c2b8f): `### Changed` pattern accepts `\r?\n`; CRLF regression test proves a breaking entry bumps the major.
        3. Double read (18c2b8f): new `Changelog.require_unreleased_entries()` reads once with the same two messages; preflight calls it. Edge: the section heading is now matched at a line start only.

        ## OO scores (before = main, after = HEAD)

        - release.py: module_size 692 to 679; all else unchanged.
        - readme_sha.py: module_size 460 to 456; avg_complexity 4.25 to 4.11; avg_params 2.50 to 2.33.
        - changelog.py: module_size 83 to 82; avg_complexity 2.12 to 2.12 (equal); the rest unchanged.
        - phase01_preflight.py: module_size 339 to 331; max_complexity 36 to 33; avg_complexity 13.25 to 12.5.
        - Comment-only files: no change.

        ## Assertion count

        Round 1 started at 756 collected tests; now 763. Only the five T2 tests were dropped, each covered as described.

