      prose: |
        Wave 0 of docs/design-release-failure-harness.md delivered: FaultRule
        (argv-prefix match by Path(argv[0]).name, skip/times-bounded or
        unlimited consumption, scripted CompletedProcessSpec response(s) or a
        raised exception, interrupt_after(event) for the rule-anchored
        worker-thread interrupt primitive, from_fixture(name) for the recorded-
        gh-envelope loader) and FaultInjectingOps (a ReleaseOps double delegating
        unmatched git calls to a real _run, deny-by-default AssertionError for
        any other unmatched/non-passthrough command, lock-guarded routing table
        verified thread-safe under a real ThreadPoolExecutor).

        22 unit tests in tests/harness/test_fault_ops.py cover every Wave 0
        acceptance-criteria bullet in §5, including the required negative test
        (a ["gh", "--version"] passthrough does not admit ["gh", "pr", "merge"])
        and the interrupt_after no-op regression test (§2c's "not a
        phase-boundary tool" correction). Zero changes to tests/test_release.py,
        zero src/ changes, make check green before both commits.

        Five design-doc-authorized deviations from the mission contract's
        original text are documented in full in the PR description
        (https://github.com/punt-labs/punt-kit/pull/355) and in
        .tmp/missions/results/m-2026-09-11-001.md: (1) interrupt simulation is
        raises=KeyboardInterrupt plus rule-anchored interrupt_after, not a
        global-call-count interrupt_after or a blocking FaultRule primitive;
        (2) interrupt_after is implemented as FaultRule.interrupt_after(event),
        a method, not a free function taking ops as a parameter — a deliberate
        PY-OO-7 compliance choice, not a semantic change; (3) FaultRule.from_fixture
        returns a CompletedProcessSpec (per the design's own text), not a
        FaultRule; (4) added constructor validation (exactly one of
        response/responses/raises, skip >= 0, explicit times >= 1, non-empty
        responses) beyond the design's literal dataclass sketch, per PY-CC-2;
        (5) kept CompletedProcessSpec/RunFn/_FixtureEnvelope co-located in
        fault_ops.py rather than a separate types.py, matching the design's
        explicit two-file Wave 0 deliverable list over the general PY-IC-9
        guideline.

        PR opened, not merged, per the contract's success criteria. Branch
        feat/harness-wave0 off main after PR #351 (design doc) merged.
