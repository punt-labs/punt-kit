      prose: |
        Round 2 addresses all three findings from ethos mission show /
        .tmp/missions/results/m-2026-09-11-001-eval-round1.md, on PR #355
        (commit a7f457a, branch feat/harness-wave0):

        1. EVALUATOR (rmh, blocking): the concurrency test
           (test_times_bounded_rule_is_consumed_exactly_once_under_concurrency)
           passed identically with FaultInjectingOps._lock removed (0/1000
           failures) — the critical section is too short for the GIL to ever
           preempt inside it, so the stress test provided no evidence either
           way. Added test_run_blocks_on_the_routing_table_lock_until_released:
           holds ops._lock from the test thread, asserts a concurrent run() call
           blocks (bounded TimeoutError) until released, then asserts it
           completes and consumes the rule exactly once. Manually verified this
           new test fails when the lock is removed and passes when restored —
           the deterministic proof the evaluator asked for. Kept the original
           stress test as a secondary sanity check per the evaluator's own
           recommendation ("keep or drop... your call").
        2. BOT (qodo, thread PRRT_kwDORSgPKM6hU6NT): FaultRule.try_consume set
           _interrupt_event before checking raises, so an anchored rule that
           raises signaled completion even though its call never returned.
           Reordered — the event now fires only immediately before returning a
           built scripted response, never on the raise path — matching §2c's
           "fires ... after a rule-matched call returns" exactly. Regression
           test: test_interrupt_after_does_not_fire_when_the_anchor_raises.
           Replied to the thread with the fix summary and resolved it via
           GraphQL.
        3. BOT (copilot, thread PRRT_kwDORSgPKM6hU75y): an empty match sequence
           (or empty match[0]) passed FaultRule's constructor validation but
           _matches_argv_prefix rejects everything against it, so the rule
           silently never engages, surfacing later only as an unrelated
           deny-by-default AssertionError. FaultRule.__post_init__ now rejects
           an empty match or empty match[0] at construction; extended the same
           rejection to FaultInjectingOps's passthrough entries (identical
           failure mode, not explicitly asked for but the same bug class — kept
           the fix narrowly scoped to this one addition). Four new tests cover
           all four combinations (FaultRule match empty / match[0] empty,
           passthrough prefix empty / prefix[0] empty). Replied to the thread
           and resolved it via GraphQL.

        Also declared the previously-undisclosed times-as-InitVar deviation
        rmh spotted in round 1 (item 6 in the PR description's deviation list)
