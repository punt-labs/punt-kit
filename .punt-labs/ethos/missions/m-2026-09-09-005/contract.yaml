context: 'standards/go.md section 7 (Static Analysis, ~lines 270-294) describes golangci-lint as the Go lint+format gate with a pinned version (''the same pinned version runs in CI'', ''the Makefile is the source of truth for the pinned version''). The earlier egregiously false claim (that golangci-lint needs no GOTOOLCHAIN pin / that local and CI ''can never drift apart'') has already been removed. BUT the positive guidance is still incomplete: golangci-lint''s gofmt/gofumpt FORMATTERS embed the gofmt implementation of whatever Go toolchain BUILT the binary. So two installs of the SAME pinned version can disagree on formatting if one side ''go install''s a locally-compiled build (embedding the local Go''s gofmt) and the other downloads the official prebuilt release (built against a different Go). Demonstrated live in ethos PR #491: a file passed local ''make check'' but CI failed it with ''File is not properly formatted (gofmt)''. The correct principle: pinning the VERSION NUMBER alone is insufficient for formatters; local and CI must run the SAME PREBUILT ARTIFACT. IMPORTANT CONSTRAINT: a security review of the specific curl|sh install mechanism is pending and may change the recommended install FORM. Do NOT prescribe or copy any exact install command into the standard until that ruling lands.'
