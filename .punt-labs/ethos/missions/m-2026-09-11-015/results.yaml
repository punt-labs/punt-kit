      prose: |
        Implements Wave 2 of the accepted release failure-path harness design
        (docs/design-release-failure-harness.md, §1d/§4/§5 Wave 2) — the first
        wave that fixes engine code, not just test infrastructure. Branch
        feat/harness-wave2 off a fresh main, one commit per bead:

        1. pkit-f85t.10 (P0, commit 7e43310) — Phase5Tag.run created the git
           tag locally *before* pushing it. A failed push then left the tag
           at HEAD locally with nothing on the remote; --resume-from tag
           re-entered the existing-tag branch, saw "exists at HEAD," and
           returned without ever retrying the push — silently sending Phase 6
           to wait on CI for a tag that was never pushed. Fixed: the
           existing-tag branch now checks `git ls-remote --tags origin` and
           pushes when the tag is missing from the remote, leaving the
           genuinely-already-pushed case a no-op. Two harness tests: a real
           git repo with a separate bare remote (a self-remote setup, as used
           elsewhere in this test file, makes ls-remote trivially "see" an
           unpushed local tag since origin IS the same directory — the wrong
           ground truth for this defect) proves the push-fails-then-resume
           path re-pushes, and a second test proves the already-pushed case
           stays a no-op (a real-run spy asserts zero `git push` calls).

        2. pkit-f85t.5 (commit 2f6dc86) — PrMerger.merge's 6-attempt
           squash-merge retry loop had zero coverage past attempt 0. Three
           new FaultInjectingOps-driven tests: a mid-loop recovery (attempts
           1-2 transiently blocked, attempt 3 succeeds, asserting
           resolve_threads is called once up front plus once per retry),
           full exhaustion at attempt 6 (asserts the ReleaseError message),
           and the best-effort thread-re-resolve exception swallow at the
           `except (ReleaseError, SystemExit, subprocess.CalledProcessError)`
           line (a flaky resolve_threads double raises on its second call;
           asserts the loop proceeds to success and prints "Could not
           re-resolve threads, proceeding with retry"). time.sleep is patched
           via pr_merge.py's own module reference to the shared time module
           object (design §1d's single-patch-point finding) — no real sleep
           in any of the three tests. No src/ change for this bead; it is
           pure coverage of existing (correct) retry logic.

        3. pkit-f85t.6 (commit 829505e) — merge_in_sibling's finally-block
           secondary cleanup failure (checkout-to-main after a primary merge
           failure) degraded to an info log invisible in the end-of-run
           "Manual action required" recap. PrMerger.__new__ now accepts an
           optional `skips: SkipRecorder | None = None`; _sibling_pr_merge
           constructs PrMerger(ops=_ops, skips=_skips) while _pr_merge (Phase
           4's own release-PR merge, no sibling concept) keeps the bare
           PrMerger(ops=_ops). merge_in_sibling's try block gained an `except
           BaseException as exc: primary_exc = exc; raise` purely to capture
           the primary exception for the finally block's message — it always
           re-raises, never swallows. When the secondary checkout also fails
           AND a skips recorder is present AND a primary exception was
           captured, the notice (naming both failures) routes through
           `self._skips.record(...)`; otherwise it falls back to the original
           `self._ops.info(...)`. Two tests: one asserts skips.drain() yields
           a single notice mentioning both the primary ReleaseError text and
           the secondary checkout stderr; a second (no skips= passed, mirroring
           _pr_merge's shape) asserts the original info-only behavior is
           unchanged — the routing is additive, not a replacement for every
           caller.

        4. pkit-f85t.8 (commit 19634c2) — gh.py's RequiredChecksWaiter.wait
           computed `deadline = time.time() + 7200` inline, duplicating
           timeouts.CI_WATCH (same value, no enforced agreement). Now
           `from ...timeouts import CI_WATCH` and `deadline = time.time() +
           CI_WATCH`. Two tests: a source-scan asserting the "7200" literal is
           gone and "CI_WATCH" appears in gh.py's source, and a behavioral
           test that monkeypatches `gh_mod.CI_WATCH` to -1 and asserts wait()
           times out immediately — proving the deadline is actually read from
           the (patchable) module attribute at call time, not a numeric
           coincidence.

        Verification beyond make check: for each of the 4 fixes, reverted just
        that fix's source hunk (git apply -R on the single commit's src/ diff),
        re-ran the bead's new test(s) and confirmed they fail against the
        pre-fix code (all 4 did — see evidence), then restored the fix and
        confirmed the full suite green again. Working tree is clean of
        mission-scoped changes; PR #357 is open against main, not merged.

        Design-doc fidelity: read docs/design-release-failure-harness.md end
        to end before starting, specifically pkit-f85t's §1d (shared time.sleep
        seam), §4 defects #1/#2/#4/#8, and §5 Wave 2's exact scope and pairing
        rationale (fix+test as one unit for the P0 and the SkipRecorder
        plumbing). Read the merged Wave 0/1 harness (tests/harness/fault_ops.py,
        tests/fixtures/gh/) before writing new tests against it — all four
        beads' tests use FaultInjectingOps/FaultRule, no bespoke MagicMock
        closures, per the design's stated preference for new tests.

        Known session issue (not part of the write-set, flagged for
        visibility): the hosted beads DoltDB was unreachable for the entire
        session — `bd show`/`bd close` fail with "database \"beads\" not found
        on Dolt server," `bd dolt status` shows the server running (PID/port
        both live) but serving no such database, and `bd bootstrap --dry-run`
        reports it would create a *fresh, empty* database rather than recover
        the existing one — not a safe action to take unilaterally against a
        shared org DB. All four beads are implemented, tested, and committed
        but not closed; see PR #357's description for the same note.
