      prose: |
        Round 2 of m-2026-09-11-015, addressing rmh's evaluation
        (.tmp/missions/results/m-2026-09-11-015-eval-round1.md) and PR #357's
        four bot review threads. Session correction: the beads DoltDB was never
        down — the tool shell simply lacked `direnv` sourcing; `direnv exec .
        bd show/close` resolves it, as rmh's eval and the team lead's message
        both noted. All four beads are now closed.

        1. BLOCKING fix (commit 2b58146) — the round-1 remote-tag check proved
           presence but never compared SHA, so a stale remote tag from an
           earlier wrong-commit attempt read as "already exists at HEAD" and
           skipped the correcting push: the exact silent-wrong-state shape
           pkit-f85t.10 exists to kill, one branch over. Independently flagged
           by rmh, Qodo, and Copilot. Now compares the remote SHA (parsed from
           `git ls-remote`'s output) against the local tag_sha and fails loud
           with a diagnosed message on mismatch, rather than silently
           proceeding or blind-force-pushing. New test:
           `test_phase5_tag_resume_fails_loud_when_remote_tag_is_a_stale_different_sha`
           — recreates a local tag at a corrected commit while an older,
           different-commit tag of the same name sits on the remote, asserts a
           loud `ReleaseError`.

        2. Thread replies + resolution — all 4 open bot threads on PR #357:
           - Qodo "Conflicting remote tags block releases" and Copilot's
             identical finding on `phase05_tag.py` — both are item 1 above;
             replied to each individually citing commit 2b58146, verified they
             describe the same gap (both cite the same code lines, same
             "presence != identity" mechanism) before treating them as one fix.
           - Qodo "Cleanup timeouts hide merge failures" — read the full body:
             `merge_in_sibling`'s cleanup `ops.run(..., check=False)` still
             raises `subprocess.TimeoutExpired` on a hung git hook regardless
             of `check=False` (that flag only suppresses non-zero-exit
             handling, not timeout behavior), and an uncaught timeout inside
             the `finally` block replaces whatever primary exception was
             already propagating. Judged real and fixed it (commit 3b949bb):
             extracted the cleanup into `_return_sibling_to_main` +
             `_report_cleanup_failure`, wrapped both `ops.run` calls in
             `try/except TimeoutExpired`, folding the timeout into the same
             secondary-failure reporting as a non-zero exit when a primary
             exception is in flight, and re-raising unchanged when the timeout
             is the only failure (preserving exact pre-existing behavior for
             that case). Two new tests cover both branches.
           - Copilot "retry tests require a real gh on PATH" — judged real and
             fixed (commit 1eab354): `_merge_env` now patches `shutil.which` to
             a fake resolving "gh", matching the existing convention in
             `tests/test_gh_fixture_contracts.py`.

        3. rmh's two optional enhancements, both done (commit d36fd00):
           - Pinned the exhaustion test's retry count to exactly 6 via the
             `FaultRule`'s own consumed-match counter, with a comment
             explaining what an off-by-one on either side would and wouldn't
             already be caught by.
           - Added `test_sibling_pr_merge_wrapper_wires_skips_through`, driving
             the actual `release_mod._sibling_pr_merge` wrapper (not a direct
             `PrMerger(ops=ops, skips=skips)` construction) with a real
             secondary cleanup failure, closing the gap where a future dropped
             or misdirected `skips=_skips` argument at that one call site
             would go uncaught. Verified this specific claim by temporarily
             reverting the call site and confirming the new test — and only
             this test — fails.

        4. Beads: all four closed via `direnv exec . bd close <id> --reason
           "..."`, each citing every resolving commit for that bead.

        Verification discipline this round matched round 1: every fix was
        proven with a revert-and-rerun cycle (revert just that commit's src/
        hunk, confirm the corresponding new test fails for the exact reason
        the review described, restore, confirm green) before being reported as
