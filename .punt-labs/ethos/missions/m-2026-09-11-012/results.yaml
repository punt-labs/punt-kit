      prose: |
        Completion mission for Wave 1, scoped to the two criteria carried over
        from m-2026-09-11-002's exhausted round budget:

        1. STRUCTURAL READ-ONLY INVARIANT. rmh live-proved a third bypass class —
           POSIX short-flag bundling (gh api -ifx=1 repos/... sent a real
           mutating POST; -iXPUT/-iX GET/-iXGET all bundle -i with -X
           identically to the unbundled form) — because
           _flag_present/_flag_occurrences required the sensitive flag to be the
           *first* character after the dash, and bundling puts it at any
           position. Per the mission's explicit directive, replaced the entire
           enumeration approach with a structural rule:
           _is_dangerous_short_flag_cluster refuses any short-flag argv token
           (single leading -, not --) containing X, f, or F anywhere, regardless
           of position, bundling, or value — false positives accepted and free,
           since this tool's own recording table needs only the long-form
           equivalents (--method/--field/--raw-field), which pflag never bundles
           (only single-dash tokens bundle). Switched the recording table's three
           GraphQL query commands from -f to --raw-field accordingly.
           --method/--field/--raw-field/--input retain their own long-form-only
           equals-form, repeated-occurrence-last-wins, and key=@file checks,
           since long flags have no bundling surface. Rewrote the parametrized
           accept/refuse test lists: accepts now covers only long-form flags plus
           a harmless unbundled short flag (-i, no sensitive character) proving
           the rule doesn't over-refuse; refuses adds all four live-proven
           bundled forms plus the now-structurally-caught bare short forms.
           Re-verified the "structurally incapable of mutating" docstring claim
           by re-recording all 16 live fixtures against the new command shape and
           confirming --check reports no drift.

        2. RUN-SELECTION CONCLUSION FILTER. This was already fixed earlier in the
           same PR (commit 71a3c63, carried forward unchanged in this round):
           GhTargetDiscovery._latest_release_run requires event == "push" AND
           conclusion == "success" together, walking past any newer dispatch/
           failed/in-progress run to the most recent one that actually
           completed; raises a clear LookupError when none exists rather than
           recording failure data as the healthy-run fixtures or blocking in
           gh run watch. Regression tests cover both a failed and a still-running
           newer run being correctly skipped, and the raise-when-none-succeeded
           case. The Copilot thread on this finding was replied to and resolved
           in the same commit.

        No src/ changes. make check green on every commit. All 28 review threads
        (spanning both missions) read, replied to, and resolved — 0 unresolved.
        PR #356 not merged.
