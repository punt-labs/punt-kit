context: "Bead pkit-ewox, second final-review round. Worktree/branch: /home/jfreeman/Coding/punt-labs/punt-kit/.claude/worktrees/release-legacy-helpers, refactor/release-legacy-helpers. Commit on that branch; do not push, do not touch PRs or merge. Do NOT edit CHANGELOG.md — list user-visible changes in the result. Test-first for every behavior fix; say per test that it failed first.\n\nJ. JSON/BOM COMPLETENESS (code-reviewer + silent-failure F1, F7)\nJ1. Every JSON read in src/punt_kit goes through JsonFile/TextFile — at minimum init.py ~645/662/785, audit.py ~376/494/854, seed.py ~424, detect.py ~121 (package.json, currently `open()` with no encoding) and ~201. grep for `json.load(` and `json.loads(` and route each; report the final grep.\nJ2. A parse error must never be turned into silence or an empty config: init's `_init_permissions` must FAIL (not overwrite settings.json with permissions only — that destroys the user's hooks/env); `_read_plugin_field` / `_get_plugin_name` / detect's plugin manifest read report a failure instead of `continue`/`pass`/falling back to the directory name; audit reports a parse error as FAIL naming the file and the reason. Tests incl. a BOM'd settings.json surviving `punt init` intact.\nJ3. init.py ~421 rewrites pyproject.toml via tomli_w, dropping comments, line endings, and BOM. Edit the specific table textually through TextFile (as Phase 2 does), or if a structural rewrite is unavoidable, refuse to rewrite a file with comments and tell the user what to add. State the choice. Test.\nJ4. install_urls.py ~210 urlparse on an unbalanced `https://[` token raises an uncaught ValueError: treat it as not-an-install-URL. Test.\n\nK. RELEASE ERROR REPORTING (silent-failure F2, F3, F6, F8)\nK1. run_release (release.py ~785/788) must print the incomplete-release report — recap of recorded skips/failures and the --resume-from hint — for ANY exception, not only ReleaseError/TimeoutExpired; then exit non-zero (re-raise or exit 1 with the traceback shown). Additionally convert JSONDecodeError / UnicodeDecodeError at JsonFile.load / TextFile.read into ReleaseError naming the path. Test: an injected Phase 11 JSONDecodeError after a recorded Phase 10 failure still prints the recap with that failure.\nK2. pr_threads.py ~78-80: real `gh api graphql` exits 1 on GraphQL errors. On non-zero exit, `warn` with the PR number and gh's stderr. Fix the existing errors-test to exit 1 with stderr as real gh does (keep an exit-0 errors case only if gh can produce it — say).\nK3. pr_threads severity: every \"merge may fail\" branch is `warn` (JSON decode ~84-89 included); a partial or total resolution failure warns with the count and is not printed as green ok; `hasNextPage: true` with a null or repeated endCursor warns instead of stopping silently. Tests.\nK4. audit_github.py ~134-135: a non-zero `gh api …/rulesets` reports the stderr; FAIL only on a definite 404 or empty list, otherwise INFO \"could not check: <stderr>\". Test.\nK5. gh.py ~200-207: a null-rollup poll that parses into the expected shape must reset structure_errors (per the docstring). Test.\n\nL. PROPAGATION / VERIFY CONSISTENCY (silent-failure F4, F5, F9)\nL1. phase10_propagate.py ~120-122 (install-all \"no entry — skipping\", which also skips the profile refresh) and ~405-407 (website \"no entry — skipping\"): record each as a skip with the manual action, matching Phase 11's verdict; the profile refresh must still run if it can. Tests.\nL2. Phase 2 (~74-86 pyproject, ~97-110 __init__.py): use re.subn and FAIL when a present version field is not rewritten (single quotes, inline table) — never print ok for a no-op. Phase 11 must FAIL when `__version__` exists but cannot be parsed. Accept single-quoted `__version__` in both if the project uses it — state the rule. Tests.\nL3. Skip notices must be accurate: WebsitePropagator checks the optional sibling before resolving the slug (no \"manual action\" when the step would be skipped anyway); Phase 11's bare-project skip lists only checks that apply; readme_sha's inline line names the real reason (slug lookup) not \"stale pins\"; phase08 prints a warn verdict when doctor exits non-zero. Tests.\n\nM. TEST STRENGTH (silent-failure T2-T4)\nM1. test_a_null_anywhere_in_the_threads_response_resolves_nothing: assert \"merge may fail\" for the five warn shapes and silence only for the two that should be silent.\nM2. test_absent_github_dedups_to_single_recap_across_phases: assert the notice equals GITHUB_ABSENT_SKIP.format(...).\nM3. Add an end-to-end run_release test whose stdout must contain a ProjectRemote/Phase 11 skip notice in the printed recap (pairs with K1).\n\nN. DOCSTRINGS / NARRATION (compliance review)\nN1. phase11_checks.py ~102-107 MarketplacePinCheck: the caller passes the repository name (from the slug) and the marketplace short name — not the PyPI distribution name; same fix at phase10_propagate.py ~292-293.\nN2. pin_rules.py ~15-17: \"the same instance\" -> both sides build the pin through the same classmethod.\nN3. gh.py ~79-83 RequiredChecksWaiter.wait: two runs — query failures (non-zero exit, timeout, unparsable JSON, GraphQL errors) share one; structural failures have the other; five in a row ends the wait; a query failure never resets the structure run; only a response that parses into the expected shape resets it.\nN4. PY-DOC-2: skips.py ~31-32 (\"no longer hard-fails\"), phase10_propagate.py ~499-503 (\"as before\"), gh.py ~331 (past-tense narration); replace every \"already diagnosed\" remnant (phase02 ~161-162, phase08 ~98-100, phase05 ~162-164, git.py ~66 and ~120, pr_merge.py ~369-371) with a statement of the convention (check=False and a diagnosed fail).\n\nP. INVARIANTS — make each true AND enforced by a test that fails on a violation (invariant-completeness review)\nP1. Spawn scan (tests/harness/spawn_scan.py): bind `from asyncio import subprocess`, `from concurrent.futures import process`, and treat `vars(<watched>)` / `sys.modules[\"<watched>\"]` like getattr. Negative tests.\nP2. One currency predicate per pin kind: the README/website writer's \"already current\" (InstallUrl.is_pinned_to, textual prefix) and Phase 11's InstallShaCheck.of (rev-parse resolve-and-compare) must be ONE predicate — RULING: the writer rewrites any pin that does not resolve to the new commit (resolve-and-compare), so the writer can repair everything the verifier flags. Phase 11 verifies EVERY install-all/profile match, not only the first (add ShaPin.all_shas). Test: an `abc1234f00`-style prefix collision gets rewritten; a second stale install-all line fails Phase 11.\nP3. audit.py ~775-806 `_RAW_GH_URL_RE` is a third README pin rule (hardcodes punt-labs, rejects `main`, reads raw): route it through InstallUrlRecognizer and the project's own slug. Add a guard test that fails if any module outside install_urls.py / pin_rules.py builds a raw.githubusercontent / install.sh / install-all pin regex. Fix install_urls.py's \"single definition\" docstring if anything remains outside.\nP4. tests/test_release_invariants.py H3 guard must catch `p = root / \"CHANGELOG.md\"; TextFile(p).read()`, `f = TextFile(p); f.read()`, `(root / CHANGELOG_NAME)…` with an imported constant, and `git show …:CHANGELOG.md`. Negative test for each.\nP5. RepoSlug-only guard: a test that fails on `github.com` slug parsing or `.split(\"/\")` on a remote URL outside repo_slug.py; one factory for the marketplace EntryMatcher shared by Phase 10 and Phase 11.\nP6. No-suppression guard: a test that fails on noqa / type: ignore / pyright: ignore / pylint: disable / nosec / pragma: no cover in src/ and plugin/.\nP7. Skill/command pairing also pairs on the SKILL.md frontmatter `name:`.\nP8. Release-managed file I/O guard: route audit.py README (~784), install.sh (~740), CHANGELOG scaffold write (~324) through TextFile; consolidate the three `.removeprefix(\"\uFEFF\")` copies on `git show` output (phase01_preflight ~344, plugin_swap ~67, phase11_checks ~146) into one TextFile helper (e.g. TextFile.from_bytes/decode); add an AST guard that fails on read_text/write_text/open for release-managed file names (CHANGELOG.md, pyproject.toml, __init__.py, install.sh, install-all.sh, plugin.json, README.md, marketplace.json, projects.json, settings.json) in src/.\n\nESCALATE instead of deciding if: a fix changes a CLI flag or exit code beyond K1's non-zero exit on an unexpected exception (which is RULED: do it); or J3 forces a choice that changes what `punt init` writes for existing users.\n"
