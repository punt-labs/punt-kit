      prose: |
        Round 2 scope: rmh's round-1 evaluation (independently confirmed by
        Copilot's PR review) found the pkit-f85t.7 sweep incomplete against
        its own stated criteria — six named sites (GitWorkspace.
        ensure_on_main, .checkout_or_create, .commit_if_staged, Phase5Tag's
        tag creation, PrMerger.merge's three inline checkout/pull/rev-parse
        blocks, Phase9PostRelease's cleanup path) plus a seventh Copilot
        found independently (Phase2VersionBump's uv lock). All seven
        converted in commit 6c32ca1, each with its own harness scenario (12
        new tests): GitWorkspace's checkout/pull/commit sites got dedicated
        unit tests against the class directly; Phase5's tag creation and
        Phase2's uv lock got isolated phase tests; PrMerger's three
        duplicated blocks were extracted into one _sync_local_main helper
        (a genuine duplication reduction, not just a relocation) with two
        tests covering its checkout/pull failures and its rev-parse kept
        check=True with an inline justification; Phase9's cleanup path got
        two tests (checkout failure, branch-delete failure) plus one more
        for the restore-script-itself-failing branch Copilot's suppressed
        review comment flagged separately.

        Two qodo findings were also fixed with code, not just replies
        (commit c318c4d): the Phase 4 swap-script retry test now uses the
        REAL release-plugin.sh with a REAL rejecting pre-commit hook instead
        of intercepting the whole ops.run call, so it genuinely reaches the
        staged-but-uncommitted partial state and proves the retry lands a
        production-shaped commit (name swapped, dev command actually removed
        from disk) before reaching merge. The Phase 8 retry-loop timeout test
        now fails a non-zero first attempt then raises TimeoutExpired on a
        genuine second attempt (phase08_verify_pypi's own time.sleep patched
        to a no-op), with both FaultRules' consumption counts asserted so a
        regression that stopped retrying after the first failure fails the
        test for the right reason.

        Before reopening/reclosing the bead, I re-ran the same audit
        methodology rmh used (grep every check=True-default ops.run/self.
        _ops.run call in src/punt_kit/phases/, classify each) against the
        post-round-2 state as a self-check, rather than trusting round 2 was
        exhaustive. It found five more sites of the identical missed shape:
        ReadmeShaPin.land has its own separate copy of the exact
        checkout-main + branch-delete cleanup pattern Phase 9 already had
        fixed (a second occurrence of the same bug class, not caught because
        it lives in a different class); PrMerger.merge_in_sibling's git
        status read against the sibling checkout (cross-repo, same class as
        SiblingRepo.validate's reads); Phase8VerifyPypi's editable-install-
        restore call (uv tool install --editable ., same external-tool risk
        as the retry loop three lines above it); and Phase5Tag's git
        ls-remote --tags origin in the resume path (network, same class as
        git fetch origin and this phase's own tag push). All five converted
        in commit 46cddec with five more tests, and ReleaseOps.run's
        docstring now states the sweep's boundary explicitly (which
        call-site classes convert vs. which stay check=True and why) so a
        future audit has one place to check the criteria against instead of
        inferring them from scattered comments.

        Total: 24 converted call sites across 13 methods, three audit
        passes, 31 new tests (11 matrix-row + 20 sweep scenarios), well
        under 2s combined added wall-clock. Full suite: 669 passed (was 652
        after round 1), 14 skipped, zero regressions.

        pkit-f85t.7: reopened via bd update --status=in_progress, then
        re-closed citing all commits across all three passes with an
        accurate, audited completeness claim (no longer asserting "swept
        every call site" without the evidence to back it — this time the
        close text names the audit methodology and its scope explicitly).

        PR #359 (branch feat/harness-wave4, off main, not merged): pushed
        0c856a7 through the six round-2 commits. All three open bot review
        threads replied to with the specific fixing commit and resolved via
        GraphQL resolveReviewThread (isResolved: true for all three). CI is
        green — docs/lint/test/CodeQL all SUCCESS, Cursor Bugbot NEUTRAL —
        but mergeStateStatus reads BLOCKED with an empty reviewDecision,
        which looks like a pending formal-approval gate rather than any
        outstanding check or finding; flagged as an open question since it's
        outside what a review-thread reply or fix commit can resolve.

        Full narrative also at
        .tmp/missions/results/m-2026-09-11-018-round2.md.
