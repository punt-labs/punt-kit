      open_questions:
        - The contract's row 31/32 line reads 'Phase 8 dry-run hang via TimeoutExpired' — the design doc's own row 31 text (and the actual code) has no dry_run branch for the retry loop; I built the test against the real (dry_run=False) 10-attempt uv tool install retry loop, matching the design doc's literal row 31 definition. Flagging in case 'dry-run' was meant literally and a second, dry-run-specific test is wanted.
        - 'pkit-f85t.7''s sweep scope: converted every check=True-default call site I judged operationally fragile (network, external tool, hook-firing mutation, or a cross-repo/sibling checkout read) — six sites total, one per commit/table row in the PR description. Left unconverted, uncommented: local git metadata reads (branch/status/rev-parse/tag --list/log/diff/show) against the project''s own repo, already validated clean by Phase 1 before any of them run — treated as the contract''s ''constructor-time invariants OK'' exception rather than requiring per-site inline justification comments (which would have been ~60 near-identical repetitions of the same rationale). Flagging for evaluator judgment on whether that line was drawn in the right place.'
      prose: |
        Branch feat/harness-wave4 off fresh main; 12 commits, one logical
        group per phase/row plus the two pkit-f85t.7-only sites and a final
        CHANGELOG commit. make check green before every commit; full suite
        green at the end (652 passed, 14 skipped).

        ELEVEN MATRIX-ROW TESTS (commit → test):

        - Row 3 (00105d2): test_preflight_fails_actionably_when_git_fetch_
          origin_fails — non-zero git fetch origin during preflight.
        - Row 6 (00105d2): test_preflight_quality_gate_timeout_surfaces_as_
          diagnosed_exit — TimeoutExpired at the make-check call site,
          diagnosed end-to-end through run_release (not a traceback).
        - Row 55 (00105d2): test_preflight_go_quality_gate_failure_aborts_
          phase — go test -race failure, parallel to the existing Python
          make-check-failure test.
        - Row 12 (15845be): test_phase3_build_uv_build_failure_diagnoses_
          instead_of_leaking — uv build failure. Phase 3 had zero isolated
          tests before this.
        - Row 13 (2157054): test_phase4_release_pr_swap_script_failure_
          retries_cleanly — the swap script fails via fault injection, then
          a clean retry (fresh ops) lands the commit and reaches merge.
          Complements (does not replace) the pre-existing hand-simulated-
          disk-state test — this one drives the failure through an actual
          injected ops.run fault instead of hand-writing the partial state.
        - Row 20 (37026e3): test_phase5_tag_initial_push_failure_diagnoses_
          and_leaves_tag_unpushed — the initial-push-failure moment itself,
          isolated from Wave 2's resume-focused test of the same underlying
          state (that existing test is unchanged and still passes, since its
          FaultRule uses raises= which bypasses check= entirely).
        - Row 29 (500ab90): test_phase7_github_release_create_failure_
          diagnoses — gh release create failure. Phase 7 had zero isolated
          tests before this.
        - Row 31 (9fdc425): test_phase8_verify_pypi_install_timeout_mid_
          retry_loop — genuine TimeoutExpired (not just a non-zero exit) at
          the uv tool install retry loop's first attempt (a later attempt
          would hit the loop's own real time.sleep(30), which the harness
          has no seam for — first-attempt failure proves the same
          unhandled-TimeoutExpired gap without the real wall-clock cost).
        - Row 32 (c03805a): test_phase9_post_release_restore_commit_failure_
          retries_cleanly — same fault-injected-failure-then-clean-retry
          shape as row 13, targeting the restore commit specifically (the
          real restore script only stages; Phase 9's own explicit git commit
          is where a hook rejection actually lands).
        - Row 52 (c3f6f31): test_phase11_verify_cli_only_project_runs_all_
          applicable_checks — a from-scratch CLI-only fixture (install.sh,
          no plugin.json at all) driven through _phase11_verify, asserting
          it does not raise and that is_plugin/is_hybrid are both False.
        - Row 54 (2eb4623): test_run_release_default_timeout_fallback_
          diagnoses_end_to_end — TimeoutExpired at the actual first Phase 1
          call (git branch --show-current, no explicit timeout=) run through
          run_release, asserting the diagnosis names the DEFAULT_RUN=60
          fallback specifically, not a named budget (distinct from the
          pre-existing test that fabricates a 300s GIT_NETWORK timeout via a
          patched phase).

        PKIT-F85T.7 SWEEP — six call sites converted check=True → check=False
        + diagnosed ops.fail, each with its own harness scenario:

        - Phase3Build's uv build (15845be) — scenario is the row 12 test.
        - Phase4ReleasePr's plugin-swap script call (2157054) — row 13 test.
        - GitWorkspace.push, Phase 5's only caller (37026e3) — row 20 test.
        - Phase9PostRelease's restore-script call + its own restore commit
          (c03805a) — row 32 test.
        - SiblingRepo.validate's git branch --show-current and git status
          --porcelain (f328e00) — two new tests,
          test_validate_sibling_diagnoses_branch_read_command_failure and
          _status_read_command_failure. Converted because they were locally
          inconsistent with the git pull --ff-only two lines later in the
          same method, which was already check=False + diagnosed.
        - InstallAllPropagator._sync_profile_readme's git log (2cc5142) —
          design doc defect #3's own named example. One new test,
          test_propagate_install_all_sync_profile_readme_git_log_failure_
          diagnoses, distinguishing a genuine command failure (now diagnosed)
          from the already-handled empty-result "no commit has ever touched
          install-all.sh" case.

        WHY THIS MATTERS BEYOND MESSAGE QUALITY: run_release only catches
        ReleaseError and subprocess.TimeoutExpired. All six converted sites
        live in synchronous, non-threaded phases (3, 4, 5, 9, and the
        sibling-validation step of 1) — a raw CalledProcessError there had no
        handler anywhere and would have escaped as a bare traceback instead
        of the usual "Release incomplete — resume with ..." diagnosis. (Phase
        10's own call sites are different: ThreadedStep.collect's catch-all
        already catches a raw CalledProcessError there, so the design doc's
        framing of that class of gap as "not silent, just lower-quality" is
        accurate for Phase 10 specifically — but not for the six sites here.)

        SWEEP SCOPE BOUNDARY (see open_questions): left unconverted are local
        git metadata reads (branch/status/rev-parse/tag --list/log/diff/show)
        against the project's own repo, already validated clean by Phase 1
        before any of them run. Treated as the contract's "constructor-time
        invariants OK" exception, not converted or individually commented.

        WALL-CLOCK: all 14 new tests together run in 1.57s. Every timeout
        scenario uses a FaultRule raises=TimeoutExpired(...) or a monkeypatched
        fake_run raising TimeoutExpired — never a real sleep or wait. The one
        place a real time.sleep(30) exists in production code (Phase 8's
        retry loop) is deliberately never reached by the row-31 test (fails
        on the first attempt).

        PR #359: https://github.com/punt-labs/punt-kit/pull/359 (open, not
        merged). Full narrative also at
        .tmp/missions/results/m-2026-09-11-018-round1.md.
