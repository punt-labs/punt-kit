      prose: |
        PR #352 (https://github.com/punt-labs/punt-kit/pull/352), branch
        docs/config-location-standard off main, four incremental commits.

        Codified operator rulings 1 (no repo-root sentinel, any shape) and 2
        (.punt-labs/local/ always-gitignored — already matched existing text,
        confirmed rather than changed) plus the leader's provisional ruling 3
        (daemon-mutable files inside .punt-labs/<tool>/ are gitignored in place)
        across standards/punt-labs-dir.md (substantive), standards/tool-enable-disable.md
        and standards/filesystem.md (generalized cross-references, no restatement).

        Fleet survey verified independently (not just cited from the leader's
        context): confirmed the "30+ repos / 7 tools" and "~20 repos with surviving
        sentinels" figures, and found two corrections folded into the standard text:
        .vox/.lux at repo root are directories with live daemon-mutable settings
        (not "pure presence" as the standard's prior text assumed), and
        .ethos/missions.jsonl is a previously-undocumented root-tracked runtime log
        present in every ethos-adopting repo checked. Both are new rows in
        punt-labs-dir.md §9/§10.

        PR description explains why the cross-repo breaking-change protocol does not
        apply: additive-plus-deprecation, punt audit grades every open migration row
        as a warning (never a fail) until its own status reaches Done/Complete, and
        the daemon-mutable zone is purely additive (removes tracking going forward,
        changes no runtime behavior).
