      prose: |
        Branch feat/harness-wave3 off fresh main; commits 08a3826 (tests) and
        676619e (CHANGELOG). Zero src/ changes — no seam gap surfaced.

        Row 36a mechanism (test_phase10_interrupt_with_worker_mid_poll_join_
        returns_promptly): a Phase 10 website-propagator worker held genuinely
        mid-iteration in RequiredChecksWaiter.wait against a pending-forever
        GraphQL fake — 3 unarmed pending polls prove real iteration, then a
        times=None pending rule armed with interrupt_after(release._interrupted),
        the sanctioned rule-anchored worker-path interrupt. Join asserted prompt
        via bounded future.result(timeout=10.0) around _phase10_propagate: the
        task completes only after Phase 10's own ThreadPoolExecutor.__exit__
        joins the interrupted worker, so the bounded result IS the join
        assertion. The fake is never released early (its only state is pending;
        consumption counts asserted exactly: warmup == 3, armed == 1); the loop
        provably exits through the interrupt branch ("Interrupted while waiting
        for CI checks on PR #123" present, "Timed out waiting" absent).

        Row 36a report (test_run_release_interrupt_mid_poll_reports_incomplete_
        release): the identical live-worker scenario through run_release
        --resume-from propagate on the main thread (the incident topology);
        asserts exit 1, "Cleaning up after interrupt...", "Release incomplete",
        "phase 10 (propagate)", "Not confirmed landed: propagate, verify",
        "--resume-from propagate", elapsed < 10s.

        Row 48 (test_run_release_interrupt_mid_propagation_restores_owned_file_
        residue): the exact v0.14.0 owned-file residue is created by the
        propagation's own projects.json write AFTER Phase 10's entry
        auto-recovery already ran, so next-run recovery cannot be the restorer;
        the dirty-check rule arms the event and git checkout -b raises
        TimeoutExpired (the incident's own failure shape). A delegating spy
        proves the interrupt path specifically called
        _reset_propagation_siblings(fail_on_error=False) with the residue on
        disk: reset_calls == [(True, False), (False, True)]. The file is
        asserted byte-identical to HEAD and the sibling git-status clean.

        Bounding, per the mission's ask: two explicit bounds — the
        future.result(timeout=10.0) join assertion, and gh.CI_WATCH
        monkeypatched 7200s→30s so a regressed interrupted.is_set() check runs
        the loop out in ~30s and FAILS the test instead of hanging it
        (mutation-verified at 30.51s). Sleep patched near-zero (1 ms) via the
        shared time singleton punt_kit.release.time.sleep per design §1d.

        Only merged primitives (FaultRule, FaultInjectingOps, interrupt_after,
        from_fixture) and Wave 1 fixtures used; real tmp_path git repos; no new
        primitive classes. Full narrative also at
        .tmp/missions/results/m-2026-09-11-017-round1.md; PR #358's body carries
        the verification playbook.
