prose: |
    Commit 5 on fix/tracker-guard; commits 1-4 stand. Tree clean, not pushed.

      892de8e fix(tracker-guard): enforce the autopilot halt with a postcondition; redirect to the Linear label filter

    ## What changed

    autopilot.yaml check-tracker (still type llm, still first, still on_failure abort):

      postcondition:
        check: 'test "$(bd config get linear.pull_label)" = "linear.pull_label (not set in config.yaml)"'

    Exact match on the beads-only string, no pipe. Buckets 1 (repo:*) and 3
    (undetermined) both fail it, so the executor's on_failure: abort ends the playbook
    regardless of the sub-agent's prose. The llm context keeps the explanation and adds
    the one-line redirect: "Work this backlog in Linear: team Punt Labs, issues labelled
    repo:<label>, https://linear.app/punt-labs/team/PL/all?label=repo:<label>", with
    <label> from the output after repo:. A closing paragraph in the context says the
    postcondition is what stops the runner.

    SKILL.md Step 0:
    - Pre-check now says bd -C <dir> with no .beads/ climbs to the nearest ancestor
      (a sibling checkout under the workspace root reports repo:punt), prints
      "<REPO> has no beads database", and forbids both config get and where when
      .beads/ is absent.
    - Refusal: <label> is everything after repo: in the config output, never the
      directory or metadata name; prefix from `bd -C "$REPO" where` (its prefix: line),
      not cat metadata.json; paragraph ends with the label-filter URL; an explicit
      "do not name a Linear view" sentence.

    CHANGELOG: one sentence on the URL and the postcondition.

    ## Proof: real entry point (five headless claude -p runs, worktree plugin)

    Transcripts: workspace .tmp/m013-r3-{after-quarry,after-vox,tmp,homebrew-tap,
    autopilot-quarry}.jsonl; reader .tmp/m013-transcript.py. Every Bash tool_use was
    listed from each file.

    ### autopilot in quarry — EXECUTOR abort, not sub-agent prose

    Bash calls, in order:

      ls .../quarry/playbooks/autopilot.yaml .../plugin/playbooks/autopilot.yaml 2>&1; ...  (discovery)
      test -d .beads && echo "PASS: .beads exists" || ...                      -> PASS: .beads exists
      test -f Makefile || test -f CLAUDE.md && echo "PASS: ..." || ...          -> PASS: quality gates defined
      bd config get linear.pull_label                                           -> repo:quarry
      test "$(bd config get linear.pull_label)" = "linear.pull_label (not set in config.yaml)" && echo "POSTCONDITION PASS (bucket 2)" || echo "POSTCONDITION FAIL (not bucket 2 — abort)"
                                                                                -> POSTCONDITION FAIL (not bucket 2 — abort)

    Executor text around the postcondition, verbatim:

      "The output is `repo:quarry` — bucket 1. This repo is **migrated to Linear**. Let
      me confirm the postcondition fails (triggering the defined `abort`)."
      [runs the check above]
      "The tracker-check postcondition failed: this repo is migrated to Linear. The
      playbook's `on_failure: abort` ends autopilot here."
      ...
      "## Autopilot halted — quarry is migrated to Linear
      **Step 1/14 (check-tracker) aborted the playbook** ...
      - `bd config get linear.pull_label` → `repo:quarry` (bucket 1)
      - Postcondition requires `linear.pull_label (not set in config.yaml)` → **failed** → `on_failure: abort`
      ...
      **Work this backlog in Linear:** team Punt Labs, issues labelled `repo:quarry` —
      https://linear.app/punt-labs/team/PL/all?label=repo:quarry"

    The postcondition shell check was issued by the executor as its own Bash call, and
    the abort is the executor's, keyed on that exit 1. Zero bd ready/update/close.
    success, 12 turns. (Side effect, see open_questions: the session also read and
    replied to two inbound biff messages mid-run.)

