prose: |
    One commit on feat/punt-guide fixing exactly the five findings; every
    mechanical claim re-derived against the fork checkout at
    ~/Coding/punt-labs/.tmp/beads-fork (HEAD 769f8a1fce0a, the
    installed bd 1.0.4 main@769f8a1fce0a) and against the binary.

    F1. close.go:29 stamps updated_at; engine.go:462 skips a bead whose
    updated_at is after the cursor; engine.go:216-223 advances the cursor on
    every non-dry-run sync. The scoped --issues path (engine.go:355-385) feeds
    the same guarded loop, so a scoped pull does not bypass the guard. The two
    bypass sets are allowPullOverwriteIDs (only populated by bidirectional
    conflict resolution, engine.go:154-163, which the guide forbids as "a bare
    bd linear sync") and prelinkedHydrateIDs (bulk pulls only, for beads whose
    external_ref changed after the cursor, engine.go:397-405). The mechanism
    now lives once, in the cursor bullet; the proven-facts bullet points at it
    with "undone by a later pull".

    F2. The contract sentence is inserted verbatim. Verified the stale
    checkout on this machine: quarry local main 74ac563, origin/main 4bce746,
    82 commits behind; origin/main's .beads/config.yaml carries
    linear.pull_label: repo:quarry since 223e119 (2026-10-25); the checked-out
    copy has neither linear.pull_label nor issue-prefix. bd linear status
    prints Not configured in quarry, vox and ethos alike; ethos is current with
    origin and migrated, so the decoy is real on a working setup. Cause is
    cmd/bd/linear.go:808, which requires linear.team_id in config.

    F3. All three flags exist on 769f8a1f (help lines in the evidence). Run in
    ethos: the contract form returns 488 beads of which 394 are closed and 7
    are closed with an external_ref; the old form returns 50 open beads and a
    truncation notice; the unscoped form returns 4415 beads across 33 repos.

    F4. "workspace" is defined on first use in the beads-only section, in the
    contract's words; the two later uses in "Both" reuse the defined term.

    F5. tracker.go:129-136 and engine.go:1452-1459: the cursor key is
    linear.last_sync.<pull_label>, one per repo label, shared by that repo's
    push and pull. The heading and the push warning now say so: a push in
    repo A hides nothing from repo B's next incremental pull.

    Line budget: the file must stay under 80 lines while adding two sentences
    (F2) and a definition (F4), so the edited paragraphs are wrapped to ~100
    columns; MD013 is disabled in .markdownlint.jsonc and the file already
    carried a 102-column line at 4cea16a. First edit landed at 80 lines; the
    cursor bullet was tightened by one line to 79 before the gate ran, so the
    make check below is on the committed text.
