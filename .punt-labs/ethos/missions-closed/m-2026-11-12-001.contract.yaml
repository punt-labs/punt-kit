context: 'Bead pkit-eqjh. Worktree <repo>/.claude/worktrees/eqjh, branch fix/install-runs-doctor; HEAD is the leader''s WIP commit holding a first draft (install.sh Step 5 running punt doctor || true, and an unconditional PATH prepend of $HOME/.local/bin; a CHANGELOG entry). punt audit on main 3ec0c00 fails punt-kit''s own install.sh with ''install.sh runs doctor: Missing doctor verification step'' because src/punt_kit/audit.py:622 checks the substring ''doctor'' and install.sh never runs it; standards/distribution.md:195 says an installer ends with doctor. Code review of the draft found four defects, all to fix here: (1) `|| true` then an unconditional ''is ready!'' prints success over a failing doctor (punt doctor exits 1 on a required-check failure); (2) the hard-coded $HOME/.local/bin is false when UV_TOOL_BIN_DIR / XDG_BIN_HOME / XDG_DATA_HOME is set and reintroduces the stale-binary shadowing the change was meant to fix; `uv tool dir --bin` prints the real directory (verified: it exists and prints ~/.local/bin; the env-override precedence is uv''s documented behavior, not verified here); (3) the CHANGELOG claim ''as every Punt Labs installer does'' is false (lux and prfaq installers run no doctor); (4) no test pins the repo''s own install.sh passing the doctor check, and audit.py''s substring test passes a comment containing ''doctor''. Sibling installers to read: beadle/install.sh:224-240 and ethos/install.sh:363-405 (capture the doctor exit code; warn instead of ''ready'' on failure) are the pattern; biff/quarry/vox carry the silent-success defect, do not copy them. Time box 60 minutes; first commit within 30; never more than 30 minutes uncommitted. Commit on the branch only; do not push, do not touch PRs or merge; git add <file> only. The leader''s WIP commit may be amended or built on; the final history is the leader''s to squash.'
