    "AssertionError: assert ['mcp__github..._lux__*', ...] == ['mcp__github__*']  Left contains 8 more items,
    first extra item: 'mcp__plugin_beadle_email__*'". Passing (01-init-passing.txt): "13 passed, 94 deselected".
    Inverted old tests: test_init_permissions_include_plugin_mcp_servers -> _exclude_plugin_mcp_servers;
    test_init_permissions_include_cli_commands -> _grant_the_server_not_the_cli;
    test_build_standard_permissions_includes_skill_entries -> _excludes_skill_entries (+ test_init_module_has_no_skill_table);
    test_init_settings_json_includes_skill_entries -> _excludes_skill_entries;
    test_mcp_wildcards_name_real_plugin_servers -> test_the_only_mcp_wildcard_is_github (parametrized over 5 languages);
    test_mcp_wildcards_are_all_or_nothing -> test_baseline_bash_rules_are_present_for_every_project.

    Change 2, src/punt_kit/audit_permissions.py (PermissionsAudit._allow_findings extracted from findings;
    new _is_direct_server_form; new finding "No direct-server MCP forms"). Tests:
