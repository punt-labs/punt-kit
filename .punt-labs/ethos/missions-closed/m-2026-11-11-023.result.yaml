    test_the_github_wildcard_is_not_a_direct_server_form, test_a_missing_github_wildcard_fails;
    tests/test_audit.py::test_audit_fails_on_a_direct_server_wildcard, test_audit_passes_with_a_tools_enable_set_present,
    test_audit_passes_without_skill_entries (inverted from test_audit_fails_missing_skill_entries at line 624).
