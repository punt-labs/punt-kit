    Per-change TDD record (proof files under <worktree>/.tmp/vwfe-proof/):

    Change 1, src/punt_kit/init.py (build_standard_permissions; STANDARD_SKILL_PERMISSIONS and the
    plugin wildcard list deleted outright; _get_plugin_name deleted; language tools moved to a
    _LANGUAGE_TOOLS table). Tests (tests/test_init.py): test_init_permissions_exclude_plugin_mcp_servers,
    test_init_permissions_grant_the_server_not_the_cli, test_init_permissions_name_a_server_entry_point_once,
    test_init_permissions_keep_punt_cli_as_baseline, test_build_standard_permissions_excludes_skill_entries,
    test_init_module_has_no_skill_table, test_init_settings_json_excludes_skill_entries,
    test_the_only_mcp_wildcard_is_github[None|python|node|go|swift], test_baseline_bash_rules_are_present_for_every_project.
