context: |
    Worktree <repo>/.claude/worktrees/tracker-guard, branch fix/tracker-guard from origin/main af11a57. Write-set paths above are relative to the main checkout; inside the worktree they are plugin/skills/bead-review/SKILL.md etc.

    Six punt-labs repos are migrated to Linear; the set is bd config get linear.push_prefix (today ethos,quarry,qmb,beadle,biff,punt; one team Punt Labs, key PL). In a migrated repo Linear is the planning source of truth and beads is a local mirror. Proven today by a live round-trip (bead quarry-dic3 to Linear PL-307, both cleaned up): bd linear sync --push sends NO labels (var labelIDs []string is hardcoded empty in the fork's internal/linear/tracker.go), and a pull REPLACES a bead's label set with Linear's — a local-only label was wiped. A bd close in a migrated repo leaves the Linear issue open and the next pull re-opens the bead.

    /punt:bead-review is exactly a beads-only writer: it rewrites titles, bodies and priorities, closes beads, and adds theme labels, all via bd. autopilot.yaml claims and closes via bd update and bd close only. Neither mentions Linear. An agent (claude:biff) ran bead-review on biff today and none of it reached Linear.

    This unit stops the damage with the smallest user-visible fix. The full Linear backend for bead-review (audit via the Linear MCP) is a later unit; do NOT build it here.

    Detection rule, verified on this machine: bd -C quarry config get linear.pull_label prints repo:quarry; bd -C vox config get linear.pull_label prints "linear.pull_label (not set in config.yaml)"; both exit 0. bd -C quarry config get issue-prefix prints "issue-prefix (not set)" even though the YAML has the key, so issue-prefix is unusable for this test.

    The migrated siblings for the demo are at ~/Coding/punt-labs/quarry (migrated) and ~/Coding/punt-labs/vox (not migrated). Read SKILL.md, the rubric, and autopilot.yaml in full before editing; match their voice and the existing never-cd, -C "$REPO" convention.

    Language: Markdown and YAML plugin content. One shell command per Bash call; no chains.
