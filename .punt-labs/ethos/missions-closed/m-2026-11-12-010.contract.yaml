context: 'DESIGN MISSION, docs only: produce docs/designs/lang-rules-deploy.md in the worktree <repo>/.claude/worktrees/z711 (branch design/lang-rules-deploy). No code. Bead pkit-z711 (`bd show pkit-z711`, and `bd show pkit-6u5p` for the bug it fixes, `bd show pkit-pjwn` for the overlapping kit-manager bead). THE PROBLEM. punt-kit/lang-rules/<lang>/*.md is the canonical per-language set of Claude Code path-scoped rules (frontmatter `paths:`), but nothing deploys them: the workspace repo punt-labs/punt-labs/.claude/rules/ holds a hand copy from May 2026 that the leader measured on 2026-11-12 as drifted in 22 of 23 Python files (`cmp` against lang-rules/python), and because Claude Code loads an ancestor directory''s rules unconditionally (upstream bug anthropics/claude-code#16299, still open), every child-repo session nested under the workspace inherits that stale Python set at startup. The operator decided (bead text, 2026-11-10): punt-kit installs AND updates lang-rules into each repo''s OWN .claude/rules/, idempotently, with drift detected by `punt audit`; then the workspace deletes its .claude/rules/ and installs its own set for its .bin/ Python the same way. THE FORK YOU MUST SETTLE WITH A RECOMMENDATION. The bead names a ''repo-install / repo-update'' verb; DES-024 (DESIGN.md) and bead pkit-pjwn say lang-rules activation ''rides the bare punt enable'' (punt self-enabling in a repo per standards/tool-enable-disable.md §2.10), and DES-027 fixes the CLI vocabulary rules (noun-first grouping, one name across surfaces, no aliases). Decide where this operation lives on the CLI and why, consistent with DES-024, DES-027 and §2.10; the bare `punt enable` does not exist in the CLI today (`src/punt_kit/__main__.py` has init, audit, pii, release, seed, version, doctor, status), and pkit-pjwn is unstarted, so say whether this unit ships the verb alone, ships bare `punt enable` with rules as its first deposit, or something else; name the exact command line(s). ALSO SETTLE, each with a recommendation: (1) language selection: how the deployer decides which lang-rules sets a repo gets (detect.py''s ProjectInfo, a declaration in .punt-labs/punt/, both; what about a repo with two languages, and the workspace repo whose Python lives only under .bin/); (2) ownership and idempotency: what the deployer writes into <repo>/.claude/rules/, how it tells its own files from a repo''s hand-written rules (beadle has 4 of its own, z-spec 3; survey them: ~/Coding/punt-labs/beadle/.claude/rules and ~/Coding/punt-labs/z-spec/.claude/rules), whether a deployed file carries a provenance marker and what it is, how update replaces a drifted copy without touching foreign files, and what happens to a deployed file the repo has locally edited; (3) the `punt audit` drift check: what it compares (deployed copy vs the installed punt-kit''s lang-rules, byte-equal or hash), what it reports, and whether `--fix` refreshes; (4) the source of truth at run time: the installed wheel must ship lang-rules (today pyproject ships src/ only; check `[tool.uv.build-backend]` / package data and say what changes) so a consumer repo without a punt-kit checkout can deploy; (5) the workspace-delete step: the exact sequence by which punt-labs/punt-labs removes its .claude/rules/ and installs its own, and the ordering constraint against child repos (children first); (6) the paths: frontmatter in lang-rules already narrows some files (python-distribution.md to pyproject.toml, Makefile, .github/**); state whether deployment rewrites paths per repo or ships them verbatim. FLEET REALITY CHECK (required, CLAUDE.md): before writing, grep the sibling repos for .claude/rules content and any existing deploy tooling (`ls ../*/.claude/rules`, `grep -rl ''lang-rules'' ../*/Makefile ../*/.bin ../*/scripts 2>/dev/null`), and state in the doc what you found and what the design generalizes or supersedes. DOC SHAPE: follow docs/claude-md-include-standard-design.md: Summary; the proposed mechanism (command lines, file layout, marker format, audit check, wheel packaging); the fork and each settled question with the recommendation and the rejected alternatives; a DESIGN.md ADR draft (DES-038) as a section the leader will lift verbatim; the implementation write-set (every file the implementation mission will create or change, with one line each); and an operator-decisions list: every question that deviates from a settled ADR or the operator''s stated structure, phrased ''(N) X — recommend A. Confirm or course-correct''. No status language, no bead IDs in the normative text (bead IDs are fine in the operator-decisions list and the fleet survey). Lint: copy the doc to <worktree>/_lint_design.md, run `npx markdownlint-cli2 _lint_design.md` from the worktree, delete the copy; zero findings. Commit `docs(design): lang-rules deployment into per-repo .claude/rules` on the branch; do not push. Time box 90 minutes; first commit within 30; never more than 30 minutes uncommitted. Language: Markdown.'
