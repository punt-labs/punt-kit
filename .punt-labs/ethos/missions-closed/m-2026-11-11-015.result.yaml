prose: |
    Round 3 answers the invariant reviewer's five findings in one commit;
    the branch is five commits ahead of origin/main af11a57, tree clean, not
    pushed, no PR touched:

      742b544 docs(standards): the tracker is the single funnel — Linear where migrated, beads otherwise
      fc39e63 docs(changelog): record the tracker-funnel change to workflow.md
      aa58904 docs(standards): remove the last beads-is-the-funnel residue from workflow.md
      6b45e79 docs(standards): pull the mirror before validating; say where push_prefix lives; define bead as the tracker item
      43d6920 docs(standards): one tracker test, shared with the guide; qualify every beads sentence for beads-only repos

    43d6920 (16+/13-):

    CRITICAL, Invariant 1. "Beads never records what Linear does not." was
    unqualified and false in every beads-only repo. Now: "In a migrated repo,
    beads never records what Linear does not."

    HIGH, the tracker test. The standard had two criteria (pull_label set OR
    prefix in push_prefix); the guide has one. The paragraph now reads:
      It is Linear where `bd config get linear.pull_label` prints a value
      starting with `repo:` — set in that repo's `.beads/config.yaml`, flat
      (`linear.pull_label:`) or nested (`linear:` / `pull_label:`); it is beads
      (`bd`) otherwise. The migrated set is `bd config get linear.push_prefix`,
      a key of the shared beads database config, read live from any repo and
      maintained nowhere else — a roster, not a second test.
    This is the guide's test (punt-guide.md lines 16-20 in the w1c worktree:
    "Output starting with `repo:` means this repo is migrated ... The migrated
    set is `bd config get linear.push_prefix`, read live; it is maintained
    nowhere else"), so the two documents now state one rule. Round-2 MEDIUM 3
    (where push_prefix lives, both pull_label spellings) is folded into this
    sentence rather than kept as a parallel clause.

    MEDIUM, sanctioned push. "Where Linear is the record, status reaches beads
    only after Linear" now ends ", except the one sanctioned scoped push (see
    the guide)."

    MEDIUM, SHIP comment. "Linear Done, then bd close" is now "Linear Done
    first where migrated, then bd close", matching the abandon-PR comment
    below it.

    MEDIUM, LoopState. "(Linear where migrated), observed through the beads
    mirror" is now "(Linear where migrated, observed through the beads
    mirror)" so the mirror clause binds only to migrated repos.

    CHANGELOG.md is unchanged in round 3; its entry states the rule, not the
    line-level wording. Cumulative numstat origin/main..HEAD:
    standards/workflow.md 75+/49-, CHANGELOG.md 13+/0-.

