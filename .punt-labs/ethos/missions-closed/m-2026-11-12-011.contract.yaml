context: 'Docs-only, mechanical, cross-repo. punt-kit #461 merged a new tracker guide template (src/punt_kit/templates/punt-guide.md on punt-kit origin/main, commit 4c6df7b). The workspace rollout `.bin/tracker-guide-rollout.sh --apply` refreshed the deposited copy `.punt-labs/punt/CLAUDE.md` in six repos by PR, but refused eleven repos as DIRTY because their MAIN checkouts carry the operator''s uncommitted work: biff, claude-agent-sdk-smalltalk, koch-trainer-swift, lux, mcp-proxy, points, prfaq, public-website, quarry-menubar, vox, z-spec. Do NOT use --force and do NOT touch any main checkout. For each of the eleven: `git -C <repo> fetch origin`; `git -C <repo> worktree add <repo>/.claude/worktrees/guide -b chore/tracker-guide origin/main`; write the template into the worktree with `git -C punt-kit show origin/main:src/punt_kit/templates/punt-guide.md > <worktree>/.punt-labs/punt/CLAUDE.md`; prove drift first with `cmp` (non-zero before, zero after against the same `git show`); lint on a `_lint_guide.md` copy from the worktree with `npx markdownlint-cli2`, delete the copy, zero findings; commit only that file as `docs(punt): refresh the deposited tracker guide`; do not push; leave the worktree. If a repo''s origin/main lacks `.punt-labs/punt/CLAUDE.md` or the `enabled` marker, say so and skip it (the rollout script, not this mission, does first deposits). Rollout precedent and the §2.4 rules are in .bin/tracker-guide-rollout.sh; this mission changes only the guide file, nothing else (no CLAUDE.md import edits, no AGENTS.md, no beads config). The write-set paths are relative to the workspace root <repo>. Each Bash call is one command. Time box 45 minutes; first commit within 15. The result lists per repo: worktree path, commit SHA, the before/after cmp exit codes, and the lint line.'
