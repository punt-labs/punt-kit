context: 'Bead pkit-vwfe. Worktree <repo>/.claude/worktrees/vwfe, branch fix/init-audit-permission-partition (from main 189c3c6). standards/permissions.md section 3 partitions permission values: the baseline punt init seeds is only mcp__github__*, the generic build tools, the language tools, Bash(bd:*), Bash(punt:*), and for a CLI project Bash(<cli>-server:*). Every mcp__plugin_<plugin>_<server>__* wildcard and every Skill(<plugin>:<cmd>) rule belongs to the owning tool''s enable set and is never seeded; Bash(<cli>:*) is granted by the tool''s own enable, except punt whose CLI rule is baseline. punt audit checks that mcp__github__* is present and that no direct-server mcp__<server>__* form (a value starting mcp__ whose next segment is neither plugin_ nor github) appears in the checked-in settings.json. Code violating this: src/punt_kit/init.py build_standard_permissions seeds nine plugin wildcards (~522-538), the repo''s own plugin wildcard (~606), Bash(<cli>:*) for the repo''s CLI (~598-601), and STANDARD_SKILL_PERMISSIONS (43-143, extended at ~609). src/punt_kit/audit_permissions.py:73 compares against that same function, so the audit inherits the fix; the direct-server-form check is new there. seed.py:254 and tests/helpers.py use the same function. Time box 120 minutes; first commit within 30 minutes; never more than 30 minutes uncommitted. Commit on the branch only; do not push, do not touch PRs or merge; git add <file> only, never -A or -a.'
