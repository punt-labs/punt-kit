context: |
    Worktree <repo>/.claude/worktrees/tracker-funnel, branch docs/tracker-funnel from origin/main af11a57. Write-set paths above are relative to the main checkout; inside the worktree they are standards/workflow.md and CHANGELOG.md. All line numbers in the criteria are as of af11a57; re-derive them after the first edit shifts lines.

    standards/workflow.md is the canonical workflow every punt-labs repo's docs/WORKFLOW.md instantiates. It says beads is THE single funnel and never mentions Linear. Six repos are migrated to Linear (the set is bd config get linear.push_prefix; today ethos,quarry,qmb,beadle,biff,punt), where Linear is the planning source of truth and beads a local mirror. Proven today by a live round-trip (bead quarry-dic3 to Linear PL-307, both cleaned up): a push sends no labels; a pull replaces a bead's labels. The standard's wording is why every downstream doc, and every agent, treats Linear as secondary. This unit fixes the source.

    The rule: the tracker is the funnel; Linear in a migrated repo, beads otherwise. Mechanics belong in the deposited guide .punt-labs/punt/CLAUDE.md, written in a parallel unit — NOT in the standard. The standard states the rule and defers the how. That is the DRY boundary; do not pull mechanics back in.

    Keep the Z type name BEAD. The loop state is literally observed via bd ready in both repo kinds, the type is replicated verbatim in EnterPR (unit : ℙ BEAD) and beadsOf(pr), and in five child WORKFLOW.md schemas that may strengthen but not weaken the org schema; a rename here forces six re-alignments. Reword comments only.

    Read standards/workflow.md in full before editing, sections 2, 4 and 8 especially. Match the voice of the surrounding sections.

    Language: Markdown. One shell command per Bash call; no chains.
