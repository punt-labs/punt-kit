name: release
description: Release a Punt Labs project via the punt CLI with cross-repo propagation and verification
mode: once

parameters:
  - name: version
    type: string
    required: false
    description: Semantic version to release (e.g. 1.2.3). Auto-detected from CHANGELOG.md if omitted.

steps:
  - id: run-cli
    description: Run punt release (phases 1-11)
    type: script
    command: punt release ${version}
    background: true
    on_failure: diagnose

  - id: verify
    description: Verify the release is complete
    type: llm
    context: |
      The CLI handles phases 1-11: preflight, version bump, build,
      release PR, tag, CI wait, GitHub release, PyPI verify, post-release
      and cross-repo propagation (phases 9+10 run concurrently), and
      verification.

      All main-branch changes go through PRs (zero bypass actors). Each
      propagation step creates a branch, pushes, opens a PR, waits for CI,
      and squash-merges. The three sibling propagation PRs (.github,
      claude-plugins, public-website) run concurrently.

      Confirm the CLI reported success. If it did, spot-check:

      1. PyPI version: uv pip index versions <package> — confirm release version appears
      2. install-all.sh SHA: verify the SHA in ../.github/install-all.sh points to correct install.sh
      3. Marketplace version (hybrid/plugin projects): verify marketplace.json version and ref match
      4. Website version: verify ../public-website/src/data/projects.json if present
      5. .github profile SHA: verify the profile README's install-all.sh URL points to the expected pinned SHA

      Print a pass/fail table. If any check fails, diagnose and fix.

      If the CLI failed partway, use `punt release --resume-from <phase>` to
      resume from the failed phase. Valid phase names: preflight, bump, build,
      release-pr, tag, ci, github-release, pypi, post-release, propagate, verify.
    on_failure: diagnose
