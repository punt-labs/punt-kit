name: release
description: Release a Punt Labs project — version bump through verification
mode: once

parameters:
  - name: version
    type: string
    required: false
    description: >
      Semantic version to release (e.g. 1.2.3). If omitted, auto-detected
      from the topmost ## [X.Y.Z] heading in CHANGELOG.md.

preconditions:
  - description: In a project with pyproject.toml
    check: test -f pyproject.toml
  - description: On main branch with clean working tree
    check: test "$(git branch --show-current)" = "main" && test -z "$(git status --porcelain)"
  - description: CHANGELOG has an Unreleased section
    check: grep -q "## \[Unreleased\]" CHANGELOG.md

steps:
  - id: run-cli
    description: Run the punt release CLI (phases 1-8)
    type: llm
    context: |
      Run `punt release ${version}` (if version is empty, run `punt release`
      without arguments — the CLI auto-detects from CHANGELOG.md).

      After the CLI completes, determine the released version:
      - If ${version} was provided, use it directly.
      - If not, read the topmost ## [X.Y.Z] heading in CHANGELOG.md.

      Verify: `git tag --list "v${version}" | grep -q "v${version}"`
      The tag must exist. If it doesn't, the release failed.
    on_failure: diagnose

  - id: merge-propagation-prs
    description: Merge cross-repo propagation PRs
    type: llm
    context: |
      The CLI triggers GitHub Actions that create PRs in:
      - punt-labs/punt-kit — updates the project's SHA in install-all.sh
      - punt-labs/claude-plugins — updates version in marketplace.json
      - punt-labs/.github — updates profile README (punt-kit releases only)

      For each target repo:
      1. Check for open propagation PRs:
         gh pr list --repo punt-labs/<repo> --state open --search "propagate"
      2. Wait for CI: gh pr checks <number> --repo <repo> --watch
      3. Check for merge conflicts
      4. Merge via API: gh api repos/punt-labs/<repo>/pulls/<N>/merge --method PUT -f merge_method=squash
      5. Delete branch (URL-encode slashes):
         branch=$(gh pr view <N> --repo <repo> --json headRefName --jq '.headRefName | @uri')
         gh api "repos/punt-labs/<repo>/git/refs/heads/$branch" --method DELETE

      All propagation PRs must be merged before proceeding.

  - id: website-sync
    description: Update public website project data
    type: llm
    context: |
      Update ../public-website/src/data/projects.json:
      1. Find the entry matching this project (by id, name, or pypiUrl)
      2. Update "version" to the release version
      3. If install.sh changed, update "installCommand" with the new SHA
      4. Commit and push:
         cd ../public-website
         git add src/data/projects.json
         git commit -m "chore: bump <project-name> to v${version}"
         git push origin main

      Skip if ../public-website doesn't exist.

  - id: update-github-profile
    description: Update .github profile README with new punt-kit SHA
    type: llm
    context: |
      After install-all.sh changes are merged into punt-kit, the .github
      profile README needs the new punt-kit SHA.

      1. Get latest punt-kit main SHA: git -C ../punt-kit rev-parse --short HEAD
      2. Update curl URL in ../.github/profile/README.md
      3. Commit and push:
         cd ../.github
         git add profile/README.md
         git commit -m "chore: update install-all.sh SHA to <short-sha>"
         git push origin main

      Skip if ../.github doesn't exist or no install-all.sh changes.

  - id: verify-pypi
    description: Verify package appears on PyPI
    type: llm
    context: |
      Extract the package name from pyproject.toml using Python's tomllib:
        python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text()).get('project',{}).get('name',''))"

      Then verify the release version appears:
        uv pip index versions <package-name> 2>/dev/null | head -1

      The version ${version} must appear in the output.
    on_failure: diagnose

  - id: verify-install-sha
    description: Verify install-all.sh SHA and VERSION pin
    type: llm
    context: |
      Determine the correct path to install-all.sh:
        if [ -f ./install-all.sh ]; then use ./install-all.sh
        else use ../punt-kit/install-all.sh

      Find this project's curl line. Extract the SHA. Then verify:
        git show <SHA>:install.sh | grep 'VERSION='
      The VERSION must equal the release version. Warn if no VERSION pin.

  - id: verify-marketplace
    description: Verify marketplace version for hybrid/plugin projects
    type: llm
    context: |
      For hybrid or plugin projects, read ../claude-plugins/.claude-plugin/marketplace.json.
      Find this project's entry. Verify version matches and ref is v${version}.
      Skip for CLI-only projects.

  - id: verify-website
    description: Verify website project data is current
    type: llm
    context: |
      If ../public-website/src/data/projects.json exists, verify this
      project's version matches ${version}.

  - id: verify-profile
    description: Verify .github profile SHA is current
    type: llm
    context: |
      Verify the ../.github/profile/README.md points to the current
      punt-kit main SHA.

  - id: print-summary
    description: Print verification summary table
    type: llm
    context: |
      Print a table showing each verification check and its result:
      - PyPI version
      - install-all.sh SHA + VERSION pin
      - Marketplace version (if applicable)
      - Website version (if applicable)
      - .github profile SHA (if applicable)

      Every row must show a pass. If any row fails, report what needs fixing.
